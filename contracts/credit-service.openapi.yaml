openapi: 3.1.0
info:
  title: FoC Credit Service API
  version: 1.0.0
  summary: Read-only wallet and immutable ledger API.
  description: |
    Students can read only the wallet resolved from their bearer token. Administrators can use the
    explicit admin routes; every admin read attempt is appended to the audit log. Credit mutations
    are asynchronous domain events and are not exposed over HTTP.
servers:
  - url: http://localhost:3004
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /wallets/me:
    get:
      operationId: getMyWallet
      summary: Read the authenticated user's wallet.
      responses:
        '200':
          description: Wallet balance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/WalletNotFound' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /wallets/me/ledger:
    get:
      operationId: getMyLedger
      summary: Read immutable wallet activity, newest first.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One cursor page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LedgerPage' }
        '400': { $ref: '#/components/responses/BadPagination' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/WalletNotFound' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /admin/wallets/{userId}:
    get:
      operationId: getWalletAsAdmin
      summary: Read any wallet and append an audit record.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Wallet balance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/WalletNotFound' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /admin/wallets/{userId}/ledger:
    get:
      operationId: getLedgerAsAdmin
      summary: Read any immutable ledger and append an audit record.
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One cursor page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LedgerPage' }
        '400': { $ref: '#/components/responses/BadPagination' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/WalletNotFound' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned by the previous page.
      schema: { type: string, minLength: 1 }
  schemas:
    Health:
      type: object
      required: [status, service, version, uptimeSeconds]
      properties:
        status: { type: string, const: ok }
        service: { type: string, const: credit-service }
        version: { type: string }
        uptimeSeconds: { type: number, minimum: 0 }
    Wallet:
      type: object
      required: [userId, available, reserved, total, createdAt, updatedAt]
      properties:
        userId: { type: string }
        available: { type: integer, minimum: 0 }
        reserved: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0, description: Always available + reserved. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LedgerItem:
      type: object
      required:
        - transactionId
        - type
        - amount
        - orderId
        - occurredAt
        - resultingAvailable
        - resultingReserved
        - resultingTotal
      properties:
        transactionId: { type: string, format: uuid }
        type: { type: string, enum: [ISSUE, RESERVE, RELEASE, TRANSFER] }
        amount: { type: integer, minimum: 1 }
        orderId: { type: [string, 'null'] }
        occurredAt: { type: string, format: date-time }
        resultingAvailable: { type: integer, minimum: 0 }
        resultingReserved: { type: integer, minimum: 0 }
        resultingTotal:
          type: integer
          minimum: 0
          description: Always resultingAvailable + resultingReserved.
    LedgerPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/LedgerItem' }
        nextCursor: { type: [string, 'null'] }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlationId]
          properties:
            code: { type: string }
            message: { type: string }
            correlationId: { type: string }
            details: {}
  responses:
    BadPagination:
      description: Invalid cursor or limit.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthenticated:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Account inactive or administrator role required.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    WalletNotFound:
      description: Activation has not produced a wallet yet.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    IdentityUnavailable:
      description: Live identity could not be resolved safely.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
