openapi: 3.1.0
info:
  title: FoC User Service API
  version: 1.0.0-draft.1
  summary: Identity, sessions, RBAC and account status for Friend on Campus.
  description: |
    **DRAFT — proposal for FND-03 (#117). Not frozen until the producer (Anselm) and one consumer
    owner (Patrick for `web-app`, Jonus for platform) approve the PR.**

    ## Conventions (cross-service proposals — see `contracts/README.md`)
    - IDs are UUID strings. Timestamps are RFC 3339 UTC (`2026-09-21T08:30:00Z`).
    - Every error uses the `Error` envelope. `401` = missing/invalid/expired access token, or
      `STEP_UP_REQUIRED` (re-enter the password with `POST /auth/step-up`, then retry),
      `403` = authenticated but not allowed, `404` = absent, `409` = state conflict,
      `422` = validation or business-rule rejection, `429` = rate limited.
    - Every request may carry `X-Correlation-Id`; it is echoed on the response and in every log line.
    - Paginated lists take `page` (1-based, default 1) and `pageSize` (default 20, 1–100).

    ## Authentication model
    - **Access token**: signed JWT, 15-minute lifetime, sent as `Authorization: Bearer <jwt>`.
      Claims are `sub` (userId), `sid` (session id), `iat`, `exp`, `jti` **only**. Role and status are
      deliberately **not** in the token: a service that needs them calls
      `GET /internal/users/{userId}`. This keeps suspension effective within seconds instead of
      waiting out the token lifetime, and means no client-visible value is an authorization input.
    - **Refresh token**: opaque, 7-day lifetime, delivered and accepted **only** as an
      `HttpOnly; Secure; SameSite=Strict; Path=/auth` cookie named `foc_refresh`. Rotated on every use;
      reuse of a rotated token revokes the whole session family. The browser never sees the refresh token
      in JavaScript, so XSS cannot steal it.
    - **CSRF**: only `/auth/refresh` and `/auth/logout` accept the cookie. They are protected by
      `SameSite=Strict`, an `Origin` header check against the configured web origin, and by requiring
      `Content-Type: application/json`. `/auth/login` (it sets the cookie) and `/auth/password` (a password
      oracle) apply the same `Origin` and content-type checks. A failed check is `403 CSRF_REJECTED`.
      All other endpoints use the bearer header, which browsers do not attach automatically. The web
      app keeps the access token in memory (not `localStorage`).
    - **Service-to-service**: `/internal/**` endpoints require the `X-Service-Key` header holding a
      per-service credential. A user access token is never accepted there.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:3001
    description: Local Compose (host port from compose.yaml)
tags:
  - name: Auth
  - name: Profile
  - name: Admin
  - name: Internal
  - name: Health

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness / readiness
      security: []
      responses:
        '200':
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                required: [service, status]
                properties:
                  service: { type: string, const: user-service }
                  status: { type: string, enum: [ok] }
              example: { service: user-service, status: ok }

  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Register a student account (US-FR1.1.1)
      description: |
        Normalizes the email, rejects addresses outside the configured NUS domain allowlist, rejects a
        duplicate without creating anything, and sends a one-time activation link. The account is
        `PENDING_ACTIVATION` until activated.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
            example:
              email: e0123456@u.nus.edu
              password: correct-horse-battery-staple
              displayName: Alex Tan
      responses:
        '201':
          description: Account created; activation email sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterResponse' }
              example:
                userId: 0198a1c2-5b3e-7c11-9d4a-2f8b6e1a7c30
                status: PENDING_ACTIVATION
        '409': { $ref: '#/components/responses/EmailAlreadyRegistered' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/activate:
    post:
      tags: [Auth]
      operationId: activate
      summary: Activate an account with the emailed one-time token
      description: |
        Single-use and expiring. **Replay-idempotent**: presenting an already-consumed token for an account
        that is already active returns `200` with `alreadyActivated: true` and publishes **no** second
        `UserActivated` event. The first successful call publishes exactly one.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              additionalProperties: false
              properties:
                token: { type: string, minLength: 20, maxLength: 200 }
      responses:
        '200':
          description: Account is active (first activation or idempotent replay).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivateResponse' }
              examples:
                first:
                  value:
                    {
                      userId: 0198a1c2-5b3e-7c11-9d4a-2f8b6e1a7c30,
                      status: ACTIVE,
                      alreadyActivated: false,
                    }
                replay:
                  value:
                    {
                      userId: 0198a1c2-5b3e-7c11-9d4a-2f8b6e1a7c30,
                      status: ACTIVE,
                      alreadyActivated: true,
                    }
        '404': { $ref: '#/components/responses/TokenInvalid' }
        '410': { $ref: '#/components/responses/TokenExpired' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in (US-FR1.1.2)
      description: |
        Only an `ACTIVE` account with valid credentials receives tokens. Sets the `foc_refresh` cookie and
        returns the access token in the body. Rate limited per IP and per email.

        A bootstrap administrator signing in with the configured bootstrap password gets
        `403 PASSWORD_CHANGE_REQUIRED` and no session; call `POST /auth/password` first (US-FR3.1.3.2).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated.
          headers:
            Set-Cookie:
              description: '`foc_refresh=<opaque>; HttpOnly; Secure; SameSite=Strict; Path=/auth; Max-Age=604800`'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
              example:
                accessToken: eyJhbGciOiJFZERTQSJ9.eyJzdWIiOiIwMTk4YTFjMi...
                tokenType: Bearer
                expiresIn: 900
                user:
                  {
                    id: 0198a1c2-5b3e-7c11-9d4a-2f8b6e1a7c30,
                    displayName: Alex Tan,
                    roles: [STUDENT],
                    status: ACTIVE,
                  }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/AccountNotLoginable' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change a password by proving the current one (US-FR3.1.3.2)
      description: |
        Proof is the current password, not an access token, so a bootstrap administrator who cannot yet
        start a session can retire the bootstrap secret, and any active user can change theirs.
        Every session of the account is revoked. Failure responses match login's, it shares login's
        rate limits, and it requires an allowed `Origin` (if sent) and `Content-Type: application/json`
        (`403 CSRF_REJECTED` otherwise).

        It proves the password, not the mailbox: until a bootstrap administrator has replaced the shared
        bootstrap password, anyone who knows that password can. Claim each seeded account at once.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: Password changed; every existing session of the account is revoked. }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/AccountNotLoginable' }
        '422':
          description: |
            `VALIDATION_FAILED`. `newPassword` outside 12–128 characters, or `PASSWORD_UNCHANGED` when it
            equals the current password or, for a bootstrap administrator, the configured bootstrap password.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/step-up:
    post:
      tags: [Auth]
      operationId: stepUp
      summary: Re-enter the password before a high-impact admin action (ADR 0008)
      description: |
        Proves the person holding the session still knows the password. Requesting or approving a role
        change, and suspending an administrator, need a re-entry within the last 5 minutes
        (`STEP_UP_WINDOW_SECONDS`) in the same sign-in, or they answer `401 STEP_UP_REQUIRED`. A token
        refresh keeps it; another login or device does not.

        Bearer-authenticated, so no cookie is involved and there is no CSRF exposure. A wrong password
        fails exactly as login does. Limited by login's per-IP limit and a per-account limit of its own.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StepUpRequest' }
      responses:
        '204': { description: Password confirmed and recorded on this session. }
        '401':
          description: |
            `UNAUTHENTICATED` (missing or expired access token, or the session has ended) or
            `INVALID_CREDENTIALS` (wrong password).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: INVALID_CREDENTIALS,
                      message: Email or password is incorrect.,
                      correlationId: 5c1f2a9e,
                    },
                }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refresh
      summary: Rotate the refresh token and issue a new access token
      description: |
        Reads the `foc_refresh` cookie. Issues a new access token and a new refresh cookie and invalidates the
        old refresh token. Presenting an already-rotated token revokes the entire session family and returns
        `401 REFRESH_TOKEN_REUSED`. Expired, revoked or unknown tokens return `401 REFRESH_TOKEN_INVALID`.
        Fails if the account is no longer `ACTIVE`, or must replace a bootstrap password first
        (`403 PASSWORD_CHANGE_REQUIRED`); either way the session family is revoked.
      security: [{ refreshCookie: [] }]
      responses:
        '200':
          description: New token pair.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/RefreshRejected' }
        '403': { $ref: '#/components/responses/RefreshForbidden' }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current refresh session
      description: Idempotent. The session is unusable within 10 seconds (US-NFR2.1.2). Clears the cookie.
      security: [{ refreshCookie: [] }]
      responses:
        '204':
          description: Logged out (also returned if the session was already gone).
          headers:
            Set-Cookie:
              schema: { type: string }
        '403': { $ref: '#/components/responses/CsrfRejected' }

  /.well-known/jwks.json:
    get:
      tags: [Auth]
      operationId: getJwks
      summary: Public keys for verifying access tokens
      description: |
        Ed25519 public keys (`alg: EdDSA`). Other services verify the JWT signature with these and never
        hold a secret. Cache with a periodic refresh; a `kid` that is not in the cached set means the key
        rotated, so refetch once.
      security: []
      responses:
        '200':
          description: A JSON Web Key Set.
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      required: [kty, crv, x, kid, alg, use]
                      properties:
                        kty: { type: string, const: OKP }
                        crv: { type: string, const: Ed25519 }
                        x: { type: string }
                        kid: { type: string }
                        alg: { type: string, const: EdDSA }
                        use: { type: string, const: sig }

  /users/me:
    get:
      tags: [Profile]
      operationId: getMe
      summary: Read the caller's own account and profile
      responses:
        '200':
          description: The caller's account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountNotActive' }
    patch:
      tags: [Profile]
      operationId: updateMe
      summary: Edit the caller's own profile (US-FR3.1.1)
      description: |
        Only the fields in `ProfileUpdate` are accepted. The schema is closed
        (`additionalProperties: false`), so `id`, `email`, `roles`, `status` and any unknown field are
        rejected with `422 FIELD_NOT_EDITABLE` and nothing is changed. `preferredMode` is the
        requester↔courier switch: it changes the UI only and is never read by an authorization decision.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
            examples:
              ok:
                value: { displayName: Alex T., preferredMode: COURIER }
      responses:
        '200':
          description: Updated account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountNotActive' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/users:
    get:
      tags: [Admin]
      operationId: listUsers
      summary: List full account records (ADMIN)
      description: |
        Full records, profile included. Every account returned other than the caller's own is
        recorded as an admin read (`GET /admin/reads`) and counts toward `BULK_READS` (ADR 0008), as
        if each were opened. To find an account, use `GET /admin/directory`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AccountStatus' }
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/Role' }
        - name: q
          in: query
          description: Case-insensitive prefix match on email or display name.
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: A page of accounts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/directory:
    get:
      tags: [Admin]
      operationId: searchDirectory
      summary: Find accounts by name, email, role or status (ADMIN)
      description: |
        The directory: email, display name, roles and status — enough to find an account and see its
        standing, and nothing of its profile. Not recorded per account (ADR 0008); opening an account
        (`GET /admin/users/{userId}`) is. Same filters, order and paging as `GET /admin/users`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AccountStatus' }
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/Role' }
        - name: q
          in: query
          description: Case-insensitive prefix match on email or display name.
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: A page of directory entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectoryPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Admin]
      operationId: getUserAsAdmin
      summary: Read any account (ADMIN)
      description: |
        Recorded as an admin read (`GET /admin/reads`) unless it is the caller's own account. Many reads
        by one admin within an hour raise a `BULK_READS` alert (ADR 0008).
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/users/{userId}/suspend:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Admin]
      operationId: suspendUser
      summary: Suspend an account (US-FR3.1.2)
      description: |
        Records an audit row, revokes all of the user's refresh sessions, and publishes `UserSuspended`.
        New sessions are denied immediately; dependent services see the change within 10 seconds.
        Only an `ACTIVE` account can be suspended (`409 ACCOUNT_NOT_ACTIVE` otherwise). An admin cannot suspend
        themselves (`409 SELF_SUSPENSION_FORBIDDEN`). Only a seeded admin may suspend another admin
        (`403 ADMIN_ACTION_NOT_PERMITTED`), and only after a recent `POST /auth/step-up`
        (`401 STEP_UP_REQUIRED`); every such suspension raises an `ADMIN_SUSPENDED` alert.

        One admin may suspend at most `ADMIN_SUSPENSIONS_LIMIT_PER_HOUR` (default 20) accounts in a
        rolling hour; the next is refused with `429 RATE_LIMITED` and changes nothing (ADR 0008).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
            example: { reason: Repeated no-show on accepted errands }
      responses:
        '200':
          description: Suspended (idempotent if already suspended — no second event).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '401': { $ref: '#/components/responses/StepUpRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RoleConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/users/{userId}/reactivate:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Admin]
      operationId: reactivateUser
      summary: Reactivate a suspended account
      description: |
        Audit row + `UserReactivated`. Idempotent if already active. An account that never activated
        (`PENDING_ACTIVATION`) is refused with `409 ACCOUNT_NOT_ACTIVE`, so reactivation cannot skip activation.

        Reactivating an **administrator** has the controls of suspending one (ADR 0008): only a seeded
        admin (`403 ADMIN_ACTION_NOT_PERMITTED`), after a recent `POST /auth/step-up`
        (`401 STEP_UP_REQUIRED`), and it raises an `ADMIN_REACTIVATED` alert.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200':
          description: Reactivated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '401': { $ref: '#/components/responses/StepUpRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RoleConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/users/{userId}/role:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [Admin]
      operationId: setUserRole
      summary: Ask to appoint or downgrade an administrator (US-FR3.1.3, US-FR3.1.3.1, ADR 0008)
      description: |
        `role: ADMIN` appoints (target must be `ACTIVE`). `role: STUDENT` downgrades an admin.
        Rules, all enforced in one transaction with a row lock:
        - Any admin may appoint.
        - Only a **seeded** admin may downgrade an admin → otherwise `403 ADMIN_DOWNGRADE_NOT_PERMITTED`.
        - No admin may downgrade themselves → `409 SELF_DEMOTION_FORBIDDEN`.
        - The last admin cannot be removed → `409 LAST_ADMIN`.
        - The caller must have re-entered their password recently (`POST /auth/step-up`) →
          otherwise `401 STEP_UP_REQUIRED`. Checked after the rules above.

        **Two people (ADR 0008).** When anyone other than the caller and the target holds the ADMIN
        role — suspended or not — nothing changes yet: the answer is `202` with a pending request,
        audited as `ROLE_CHANGE_REQUESTED`, which `POST /admin/role-requests/{requestId}/approve`
        applies. One pending request per target (`409 ROLE_REQUEST_PENDING`), checked before the next
        rule. When nobody else holds the role, the change applies at once (`200`), logged as a warning
        and marked `approval: NO_APPROVER` on its audit row. A suspended admin approves nothing, so a
        request whose only possible approvers are suspended waits for one to be reactivated.

        An applied change writes an audit row (`ROLE_GRANT` / `ROLE_REVOKE`), emits `user.role-changed`
        and raises a `ROLE_CHANGE` alert.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, reason]
              additionalProperties: false
              properties:
                role: { $ref: '#/components/schemas/Role' }
                reason: { type: string, minLength: 1, maxLength: 500 }
            example: { role: ADMIN, reason: Onboarding new operations lead }
      responses:
        '200':
          description: |
            Role changed because no other admin could approve, or unchanged because the target already
            has that role.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '202':
          description: Waiting for a second admin. Nothing has changed yet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleChangeRequested' }
        '401': { $ref: '#/components/responses/StepUpRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RoleConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/role-requests:
    get:
      tags: [Admin]
      operationId: listRoleRequests
      summary: Role changes waiting for, or decided by, a second admin (ADR 0008)
      description: Newest first. A pending request past its deadline reads as `EXPIRED`. Read-only.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/RoleRequestStatus' }
      responses:
        '200':
          description: A page of role-change requests.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleChangeRequestPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/role-requests/{requestId}/approve:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Admin]
      operationId: approveRoleRequest
      summary: Approve a role change as the second admin (ADR 0008)
      description: |
        The only way a requested change applies. Only an eligible approver may approve: not the
        requester (`409 SELF_APPROVAL_FORBIDDEN`) and not the target (`409 CONFLICT_OF_INTEREST`).
        Needs a recent `POST /auth/step-up` (`401 STEP_UP_REQUIRED`).

        Every rule of `PUT /admin/users/{userId}/role` is checked again now, for the requester: a
        requester who lost the role or was suspended meanwhile makes the request stale
        (`409 ROLE_REQUEST_STALE`), and a target suspended meanwhile cannot be appointed
        (`409 ACCOUNT_NOT_ACTIVE`). A request not decided within `ROLE_REQUEST_TTL_HOURS` (default 24)
        has expired (`409 ROLE_REQUEST_EXPIRED`); one already decided is `409 ROLE_REQUEST_NOT_PENDING`;
        one that would no longer change anything is `409 ROLE_REQUEST_STALE`. The approver must still
        be an active administrator when the change is made.

        Audited as `ROLE_GRANT` / `ROLE_REVOKE` with the approver as actor and
        `approval: SECOND_ADMIN`; emits `user.role-changed`; raises a `ROLE_CHANGE` alert.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
            example: { reason: Confirmed with the operations lead }
      responses:
        '200':
          description: Approved and applied. The target account as it now is.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '401': { $ref: '#/components/responses/StepUpRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RoleRequestConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/role-requests/{requestId}/reject:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Admin]
      operationId: rejectRoleRequest
      summary: Reject a role change, or withdraw your own (ADR 0008)
      description: |
        Any admin except the target may reject (`409 CONFLICT_OF_INTEREST`); the requester rejecting
        their own request withdraws it. Changes no role. Rejecting someone else's request needs a
        recent `POST /auth/step-up` (`401 STEP_UP_REQUIRED`), so a stolen access token cannot quietly
        reject pending demotions; withdrawing one's own does not. Audited as `ROLE_CHANGE_REJECTED`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200':
          description: Rejected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleChangeRequest' }
        '401': { $ref: '#/components/responses/StepUpRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RoleRequestConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/audit-records:
    get:
      tags: [Admin]
      operationId: listAuditRecords
      summary: Read the append-only audit trail (ADMIN)
      description: Read-only. There is no endpoint that creates, edits or deletes an audit record.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: targetUserId
          in: query
          schema: { type: string, format: uuid }
        - name: actorId
          in: query
          description: Only records written by this administrator.
          schema: { type: string, format: uuid }
        - name: action
          in: query
          schema: { $ref: '#/components/schemas/AuditAction' }
        - name: from
          in: query
          description: Only records at or after this instant.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Only records at or before this instant. Not before `from` (`422`).
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: A page of audit records, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditRecordPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/reads:
    get:
      tags: [Admin]
      operationId: listAdminReads
      summary: Which admin opened which account, and when (ADR 0008)
      description: |
        One record for each other user's full record an admin reads: opening an account
        (`GET /admin/users/{userId}`) or listing it (`GET /admin/users`). An admin's own account is not
        recorded, nor is the directory (`GET /admin/directory`). Newest first. Read-only.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: actorId
          in: query
          schema: { type: string, format: uuid }
        - name: targetUserId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: A page of admin reads.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminReadPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/alerts:
    get:
      tags: [Admin]
      operationId: listAdminAlerts
      summary: Unusual administrator activity (ADR 0008)
      description: |
        Raised as it happens and also written as a structured warning log. Newest first. Read-only.

        | Kind | When |
        | ---- | ---- |
        | `ROLE_CHANGE` | any role change is applied |
        | `ADMIN_SUSPENDED` | an administrator is suspended |
        | `ADMIN_REACTIVATED` | an administrator is reactivated |
        | `BULK_SUSPENSIONS` | one admin suspends `ADMIN_SUSPENSIONS_ALERT_PER_HOUR` (default 10) accounts within an hour |
        | `SUSPENSION_LIMIT_REACHED` | one admin is refused a suspension by the hourly limit |
        | `BULK_READS` | one admin opens `ADMIN_READS_ALERT_PER_HOUR` (default 50) accounts within an hour |

        A bulk alert is raised at most once per admin per hour.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/AdminAlertKind' }
      responses:
        '200':
          description: A page of alerts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAlertPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /internal/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Internal]
      operationId: lookupUser
      summary: Least-data identity lookup for other services (US-FR4.1.2)
      description: |
        Returns **only** existence, account status, authorization roles and display name. Never a
        password hash, refresh token, verification token or email. Consumers may cache the answer for at
        most 5 seconds. An unknown user is `200` with `exists: false` so callers can distinguish "no such
        user" from "lookup failed".
      security: [{ serviceKey: [] }]
      responses:
        '200':
          description: The identity state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityLookup' }
              examples:
                active:
                  value:
                    {
                      userId: 0198a1c2-5b3e-7c11-9d4a-2f8b6e1a7c30,
                      exists: true,
                      status: ACTIVE,
                      roles: [STUDENT],
                      displayName: Alex Tan,
                    }
                missing:
                  value: { userId: 0198a1c2-5b3e-7c11-9d4a-2f8b6e1a7c30, exists: false }
        '401': { $ref: '#/components/responses/ServiceUnauthenticated' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /internal/introspect:
    get:
      tags: [Internal]
      operationId: introspectSession
      summary: Session liveness plus identity, for the shared auth middleware
      description: |
        One call answers what an auth middleware needs after it has verified a token's signature:
        is this session still live, and who is behind it? `sid` and `sub` are the token's claims.

        `active: false` — with nothing else revealed — when the session is revoked, expired, unknown,
        or does not belong to `sub`, or its account must still replace a bootstrap password (login never
        starts such a session). A **live** session for a suspended or pending account is still
        `active: true` with its `status`, so the caller can answer 403 rather than 401.

        Consumers may cache the answer for at most 5 seconds (the documented staleness window) and must
        **fail closed** (`503`) if this endpoint is unreachable. See `auth-client/README.md`.
      security: [{ serviceKey: [] }]
      parameters:
        - name: sid
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: sub
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The session's state.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [active]
                    additionalProperties: false
                    properties:
                      active: { type: boolean, const: false }
                  - type: object
                    required: [active, userId, status, roles, displayName]
                    additionalProperties: false
                    properties:
                      active: { type: boolean, const: true }
                      userId: { type: string, format: uuid }
                      status: { $ref: '#/components/schemas/AccountStatus' }
                      roles: { type: array, items: { $ref: '#/components/schemas/Role' } }
                      displayName: { type: string }
              examples:
                live:
                  {
                    value:
                      {
                        active: true,
                        userId: 0198a1c2-5b3e-7c11-9d4a-2f8b6e1a7c30,
                        status: ACTIVE,
                        roles: [STUDENT],
                        displayName: Alex Tan,
                      },
                  }
                ended: { value: { active: false } }
        '401': { $ref: '#/components/responses/ServiceUnauthenticated' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /internal/users/{userId}/permissions:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Internal]
      operationId: lookupPermissions
      summary: Effective permissions for administrator authorization (US-FR4.1.3)
      description: |
        For services that must confirm administrator authority before acting (e.g. Supplier writes).
        `isAdmin` is true only for an `ACTIVE` user holding `ADMIN`. A suspended admin has no effective permissions.
      security: [{ serviceKey: [] }]
      responses:
        '200':
          description: Effective permissions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionsLookup' }
              example:
                {
                  userId: 0198a1c2-5b3e-7c11-9d4a-2f8b6e1a7c30,
                  status: ACTIVE,
                  isAdmin: false,
                  canPlaceOrders: true,
                  canAcceptOrders: true,
                }
        '401': { $ref: '#/components/responses/ServiceUnauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: foc_refresh
    serviceKey:
      type: apiKey
      in: header
      name: X-Service-Key

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  schemas:
    Role:
      type: string
      enum: [STUDENT, ADMIN]
      description: Authorization roles. Requester and courier are capabilities of every active STUDENT, not roles.
    AccountStatus:
      type: string
      enum: [PENDING_ACTIVATION, ACTIVE, SUSPENDED]
    PreferredMode:
      type: string
      enum: [REQUESTER, COURIER]
      description: UX preference only. Never used for authorization.
    ContactPreference:
      type: string
      enum: [IN_APP, EMAIL]

    RegisterRequest:
      type: object
      required: [email, password, displayName]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
        displayName: { type: string, minLength: 1, maxLength: 50 }
    RegisterResponse:
      type: object
      required: [userId, status]
      properties:
        userId: { type: string, format: uuid }
        status: { type: string, enum: [PENDING_ACTIVATION] }
    ActivateResponse:
      type: object
      required: [userId, status, alreadyActivated]
      properties:
        userId: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE] }
        alreadyActivated: { type: boolean }
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        password: { type: string, writeOnly: true }
    ChangePasswordRequest:
      type: object
      required: [email, currentPassword, newPassword]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        currentPassword: { type: string, writeOnly: true }
        newPassword: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
    StepUpRequest:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password: { type: string, minLength: 1, maxLength: 128, writeOnly: true }
    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, description: Seconds until expiry., examples: [900] }
        user: { $ref: '#/components/schemas/SessionUser' }
    SessionUser:
      type: object
      required: [id, displayName, roles, status]
      description: Convenience for the UI only. Not an authorization input for any service.
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        roles: { type: array, items: { $ref: '#/components/schemas/Role' } }
        status: { $ref: '#/components/schemas/AccountStatus' }

    Profile:
      type: object
      required: [displayName, contactPreference, preferredMode]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 50 }
        faculty: { type: [string, 'null'], maxLength: 100 }
        avatarRef: { type: [string, 'null'], maxLength: 500 }
        contactPreference: { $ref: '#/components/schemas/ContactPreference' }
        preferredMode: { $ref: '#/components/schemas/PreferredMode' }
    ProfileUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      description: The only student-editable fields. Everything else is admin-controlled or immutable.
      properties:
        displayName: { type: string, minLength: 1, maxLength: 50 }
        faculty: { type: [string, 'null'], maxLength: 100 }
        avatarRef: { type: [string, 'null'], maxLength: 500 }
        contactPreference: { $ref: '#/components/schemas/ContactPreference' }
        preferredMode: { $ref: '#/components/schemas/PreferredMode' }
    Me:
      type: object
      required: [id, email, roles, status, profile, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        roles: { type: array, items: { $ref: '#/components/schemas/Role' } }
        status: { $ref: '#/components/schemas/AccountStatus' }
        profile: { $ref: '#/components/schemas/Profile' }
        createdAt: { type: string, format: date-time }

    AdminUser:
      type: object
      required: [id, email, roles, status, isSeededAdmin, profile, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        roles: { type: array, items: { $ref: '#/components/schemas/Role' } }
        status: { $ref: '#/components/schemas/AccountStatus' }
        isSeededAdmin: { type: boolean }
        profile: { $ref: '#/components/schemas/Profile' }
        createdAt: { type: string, format: date-time }
        activatedAt: { type: [string, 'null'], format: date-time }
    ReasonRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    Page:
      type: object
      required: [page, pageSize, total]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    DirectoryEntry:
      type: object
      required: [id, email, displayName, roles, status, isSeededAdmin, createdAt]
      description: An account's standing, without its profile. Listing it is not recorded per account.
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        roles: { type: array, items: { $ref: '#/components/schemas/Role' } }
        status: { $ref: '#/components/schemas/AccountStatus' }
        isSeededAdmin: { type: boolean }
        createdAt: { type: string, format: date-time }
    DirectoryPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/DirectoryEntry' } }
    AdminUserPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/AdminUser' } }
    AuditRecord:
      type: object
      required:
        [id, actorId, actorType, targetUserId, action, reason, occurredAt, correlationId, approval]
      properties:
        id: { type: string, format: uuid }
        actorId:
          type: [string, 'null']
          format: uuid
          description: The administrator who acted; `null` exactly when `actorType` is `SYSTEM`.
        actorType:
          type: string
          enum: [USER, SYSTEM]
          description: '`SYSTEM` only for `ADMIN_BOOTSTRAP`, written at boot from deployment configuration.'
        targetUserId: { type: string, format: uuid }
        action: { $ref: '#/components/schemas/AuditAction' }
        reason: { type: string }
        occurredAt: { type: string, format: date-time }
        correlationId: { type: string }
        approval:
          type: [string, 'null']
          enum: [SECOND_ADMIN, NO_APPROVER, null]
          description: |
            How a `ROLE_GRANT` / `ROLE_REVOKE` was approved: by a second admin, or alone because
            nobody else held the role (ADR 0008). `null` on every other action, and on role changes
            made before the two-person rule.
    AuditAction:
      type: string
      enum:
        [
          SUSPEND,
          REACTIVATE,
          ROLE_GRANT,
          ROLE_REVOKE,
          ROLE_CHANGE_REQUESTED,
          ROLE_CHANGE_REJECTED,
          ADMIN_BOOTSTRAP,
        ]
      description: |
        `ROLE_CHANGE_REQUESTED` is written by the requester, `ROLE_GRANT` / `ROLE_REVOKE` by the
        approver, and `ROLE_CHANGE_REJECTED` by whoever rejected or withdrew the request (ADR 0008).
    AuditRecordPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/AuditRecord' } }

    RoleRequestStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, EXPIRED]
      description: '`EXPIRED`: not decided within `ROLE_REQUEST_TTL_HOURS` (default 24).'
    RoleChangeRequest:
      type: object
      required:
        [
          id,
          targetUserId,
          role,
          requestedBy,
          reason,
          status,
          createdAt,
          expiresAt,
          decidedBy,
          decidedAt,
          decisionReason,
        ]
      properties:
        id: { type: string, format: uuid }
        targetUserId: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/Role' }
        requestedBy: { type: string, format: uuid }
        reason: { type: string }
        status: { $ref: '#/components/schemas/RoleRequestStatus' }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        decidedBy:
          type: [string, 'null']
          format: uuid
          description: Who approved or rejected it (the requester, if withdrawn); `null` until decided.
        decidedAt: { type: [string, 'null'], format: date-time }
        decisionReason: { type: [string, 'null'] }
    RoleChangeRequested:
      type: object
      required: [request]
      properties:
        request: { $ref: '#/components/schemas/RoleChangeRequest' }
    RoleChangeRequestPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/RoleChangeRequest' } }
    AdminRead:
      type: object
      required: [id, actorId, targetUserId, occurredAt, correlationId]
      properties:
        id: { type: string, format: uuid }
        actorId: { type: string, format: uuid }
        targetUserId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        correlationId: { type: string }
    AdminReadPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/AdminRead' } }
    AdminAlertKind:
      type: string
      enum:
        [
          ROLE_CHANGE,
          ADMIN_SUSPENDED,
          ADMIN_REACTIVATED,
          BULK_SUSPENSIONS,
          SUSPENSION_LIMIT_REACHED,
          BULK_READS,
        ]
    AdminAlert:
      type: object
      required: [id, kind, actorId, details, occurredAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/AdminAlertKind' }
        actorId:
          { type: string, format: uuid, description: The administrator whose action raised it. }
        details:
          type: object
          additionalProperties: true
          description: Counts, thresholds and account ids. Never an email address.
        occurredAt: { type: string, format: date-time }
    AdminAlertPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/AdminAlert' } }

    IdentityLookup:
      type: object
      required: [userId, exists]
      description: Least-data lookup. `status`, `roles` and `displayName` are present only when `exists` is true.
      additionalProperties: false
      properties:
        userId: { type: string, format: uuid }
        exists: { type: boolean }
        status: { $ref: '#/components/schemas/AccountStatus' }
        roles: { type: array, items: { $ref: '#/components/schemas/Role' } }
        displayName: { type: string }
    PermissionsLookup:
      type: object
      required: [userId, status, isAdmin, canPlaceOrders, canAcceptOrders]
      additionalProperties: false
      properties:
        userId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/AccountStatus' }
        isAdmin: { type: boolean }
        canPlaceOrders: { type: boolean, description: True for any ACTIVE user. }
        canAcceptOrders: { type: boolean, description: True for any ACTIVE user. }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlationId]
          properties:
            code:
              type: string
              description: Stable machine-readable code. Clients switch on this, never on `message`.
              examples: [VALIDATION_FAILED]
            message: { type: string, description: 'Human-readable and safe to display.' }
            correlationId: { type: string }
            details:
              type: array
              description: Field-level errors for `VALIDATION_FAILED`.
              items:
                type: object
                required: [field, code, message]
                properties:
                  field: { type: string, description: 'JSON pointer-style path, e.g. `email`.' }
                  code: { type: string }
                  message: { type: string }

    # ---- Events published by this service (payloads only; envelope is in contracts/README.md) ----
    EventEnvelope:
      type: object
      description: Common envelope proposed for FND-03 / EVT-01. Every event carries these fields.
      required:
        [
          eventId,
          eventType,
          schemaVersion,
          aggregateId,
          occurredAt,
          producer,
          correlationId,
          causationId,
          payload,
        ]
      properties:
        eventId: { type: string, format: uuid }
        eventType: { type: string }
        schemaVersion: { type: integer, minimum: 1 }
        aggregateId: { type: string, format: uuid }
        aggregateVersion:
          { type: integer, description: Optional; present when the aggregate is versioned. }
        occurredAt: { type: string, format: date-time }
        producer: { type: string, examples: [user-service] }
        correlationId: { type: string }
        causationId: { type: [string, 'null'] }
        payload: { type: object }
    UserActivatedPayload:
      type: object
      description: Published exactly once, on first activation (US-FR4.1.1). Credit Service issues the starting balance.
      required: [userId]
      properties:
        userId: { type: string, format: uuid }
    UserSuspendedPayload:
      type: object
      description: US-FR4.1.4. `reasonRef` is the audit record id, not the reason text.
      required: [userId, status, reasonRef, occurredAt]
      properties:
        userId: { type: string, format: uuid }
        status: { type: string, enum: [SUSPENDED] }
        reasonRef: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
    UserReactivatedPayload:
      type: object
      required: [userId, status, reasonRef, occurredAt]
      properties:
        userId: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE] }
        reasonRef: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }

  responses:
    Unauthenticated:
      description: Missing, malformed or expired access token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            {
              error:
                {
                  code: UNAUTHENTICATED,
                  message: Authentication required.,
                  correlationId: 5c1f2a9e,
                },
            }
    StepUpRequired:
      description: |
        Missing, malformed or expired access token (`UNAUTHENTICATED`), or the action needs the password
        re-entered within the last few minutes (`STEP_UP_REQUIRED`): call `POST /auth/step-up`, then
        retry. Permission rules are checked first, so `STEP_UP_REQUIRED` means the caller may proceed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            unauthenticated:
              {
                value:
                  {
                    error:
                      {
                        code: UNAUTHENTICATED,
                        message: Authentication required.,
                        correlationId: 5c1f2a9e,
                      },
                  },
              }
            stepUp:
              {
                value:
                  {
                    error:
                      {
                        code: STEP_UP_REQUIRED,
                        message: Re-enter your password to confirm this action.,
                        correlationId: 5c1f2a9e,
                      },
                  },
              }
    ServiceUnauthenticated:
      description: Missing or invalid `X-Service-Key`. A user access token is not accepted here.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            {
              error:
                {
                  code: SERVICE_UNAUTHENTICATED,
                  message: Invalid service credential.,
                  correlationId: 5c1f2a9e,
                },
            }
    Forbidden:
      description: Authenticated but not permitted (wrong role, suspended, or a role-management rule).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            notAdmin:
              {
                value:
                  {
                    error:
                      {
                        code: FORBIDDEN,
                        message: Administrator role required.,
                        correlationId: 5c1f2a9e,
                      },
                  },
              }
            downgrade:
              {
                value:
                  {
                    error:
                      {
                        code: ADMIN_DOWNGRADE_NOT_PERMITTED,
                        message: Only a seeded administrator can downgrade an administrator.,
                        correlationId: 5c1f2a9e,
                      },
                  },
              }
            suspendAdmin:
              {
                value:
                  {
                    error:
                      {
                        code: ADMIN_ACTION_NOT_PERMITTED,
                        message: Only a seeded administrator can suspend an administrator.,
                        correlationId: 5c1f2a9e,
                      },
                  },
              }
    AccountNotActive:
      description: The account is not `ACTIVE`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            {
              error:
                {
                  code: ACCOUNT_SUSPENDED,
                  message: This account is suspended.,
                  correlationId: 5c1f2a9e,
                },
            }
    AccountNotLoginable:
      description: |
        Valid credentials but the account is `PENDING_ACTIVATION` or `SUSPENDED`, or (login only) it must
        replace a bootstrap password first (`PASSWORD_CHANGE_REQUIRED`). Or `CSRF_REJECTED`: the `Origin`
        is not allowed or the body is not JSON — checked before the credentials.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            passwordChangeRequired:
              {
                value:
                  {
                    error:
                      {
                        code: PASSWORD_CHANGE_REQUIRED,
                        message: Choose a new password before signing in.,
                        correlationId: 5c1f2a9e,
                      },
                  },
              }
            csrf:
              {
                value:
                  {
                    error:
                      {
                        code: CSRF_REJECTED,
                        message: Request origin is not allowed.,
                        correlationId: 5c1f2a9e,
                      },
                  },
              }
            pending:
              {
                value:
                  {
                    error:
                      {
                        code: ACCOUNT_NOT_ACTIVATED,
                        message: Activate your account from the email we sent.,
                        correlationId: 5c1f2a9e,
                      },
                  },
              }
            suspended:
              {
                value:
                  {
                    error:
                      {
                        code: ACCOUNT_SUSPENDED,
                        message: This account is suspended.,
                        correlationId: 5c1f2a9e,
                      },
                  },
              }
    InvalidCredentials:
      description: Unknown email or wrong password (the same response for both).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            {
              error:
                {
                  code: INVALID_CREDENTIALS,
                  message: Email or password is incorrect.,
                  correlationId: 5c1f2a9e,
                },
            }
    RefreshRejected:
      description: Refresh token invalid, expired, revoked, or reused.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            invalid:
              {
                value:
                  {
                    error:
                      {
                        code: REFRESH_TOKEN_INVALID,
                        message: Session expired. Log in again.,
                        correlationId: 5c1f2a9e,
                      },
                  },
              }
            reused:
              {
                value:
                  {
                    error:
                      {
                        code: REFRESH_TOKEN_REUSED,
                        message: Session revoked. Log in again.,
                        correlationId: 5c1f2a9e,
                      },
                  },
              }
    CsrfRejected:
      description: The request origin is not allowed, or the content type is not `application/json`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            {
              error:
                {
                  code: CSRF_REJECTED,
                  message: Request origin is not allowed.,
                  correlationId: 5c1f2a9e,
                },
            }
    RefreshForbidden:
      description: |
        CSRF check failed, or the account is no longer `ACTIVE` or must replace a bootstrap password
        (`PASSWORD_CHANGE_REQUIRED`); in those two cases its session family is revoked.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            csrf:
              {
                value:
                  {
                    error:
                      {
                        code: CSRF_REJECTED,
                        message: Request origin is not allowed.,
                        correlationId: 5c1f2a9e,
                      },
                  },
              }
            suspended:
              {
                value:
                  {
                    error:
                      {
                        code: ACCOUNT_SUSPENDED,
                        message: This account is suspended.,
                        correlationId: 5c1f2a9e,
                      },
                  },
              }
            passwordChangeRequired:
              {
                value:
                  {
                    error:
                      {
                        code: PASSWORD_CHANGE_REQUIRED,
                        message: Choose a new password before signing in.,
                        correlationId: 5c1f2a9e,
                      },
                  },
              }
    NotFound:
      description: No such resource.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: NOT_FOUND, message: User not found., correlationId: 5c1f2a9e } }
    EmailAlreadyRegistered:
      description: An account already exists for this email. No account is created.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            {
              error:
                {
                  code: EMAIL_ALREADY_REGISTERED,
                  message: An account with this email already exists.,
                  correlationId: 5c1f2a9e,
                },
            }
    RoleConflict:
      description: The change violates a role-management rule.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            last:
              {
                value:
                  {
                    error:
                      {
                        code: LAST_ADMIN,
                        message: At least one administrator must remain.,
                        correlationId: 5c1f2a9e,
                      },
                  },
              }
            self:
              {
                value:
                  {
                    error:
                      {
                        code: SELF_DEMOTION_FORBIDDEN,
                        message: You cannot remove your own administrator role.,
                        correlationId: 5c1f2a9e,
                      },
                  },
              }
            selfSuspend:
              {
                value:
                  {
                    error:
                      {
                        code: SELF_SUSPENSION_FORBIDDEN,
                        message: You cannot suspend yourself.,
                        correlationId: 5c1f2a9e,
                      },
                  },
              }
            notActive:
              {
                value:
                  {
                    error:
                      {
                        code: ACCOUNT_NOT_ACTIVE,
                        message: Only an active account can be suspended.,
                        correlationId: 5c1f2a9e,
                      },
                  },
              }
            pending:
              {
                value:
                  {
                    error:
                      {
                        code: ROLE_REQUEST_PENDING,
                        message: A role change for this user is already waiting for approval.,
                        correlationId: 5c1f2a9e,
                      },
                  },
              }
    RoleRequestConflict:
      description: |
        The request cannot be decided by this caller, or no longer at all: `SELF_APPROVAL_FORBIDDEN`,
        `CONFLICT_OF_INTEREST`, `ROLE_REQUEST_NOT_PENDING`, `ROLE_REQUEST_EXPIRED`, `ROLE_REQUEST_STALE`,
        or a role rule that now fails (`ACCOUNT_NOT_ACTIVE`, `LAST_ADMIN`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            selfApproval:
              {
                value:
                  {
                    error:
                      {
                        code: SELF_APPROVAL_FORBIDDEN,
                        message: Another administrator must approve your request.,
                        correlationId: 5c1f2a9e,
                      },
                  },
              }
            conflictOfInterest:
              {
                value:
                  {
                    error:
                      {
                        code: CONFLICT_OF_INTEREST,
                        message: You cannot decide a role change about yourself.,
                        correlationId: 5c1f2a9e,
                      },
                  },
              }
            expired:
              {
                value:
                  {
                    error:
                      {
                        code: ROLE_REQUEST_EXPIRED,
                        message: This request waited too long for approval. Ask again.,
                        correlationId: 5c1f2a9e,
                      },
                  },
              }
            stale:
              {
                value:
                  {
                    error:
                      {
                        code: ROLE_REQUEST_STALE,
                        message: The administrator who asked for this change is no longer an active administrator.,
                        correlationId: 5c1f2a9e,
                      },
                  },
              }
    TokenInvalid:
      description: Unknown activation token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            {
              error:
                {
                  code: ACTIVATION_TOKEN_INVALID,
                  message: This activation link is not valid.,
                  correlationId: 5c1f2a9e,
                },
            }
    TokenExpired:
      description: Activation token has expired.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            {
              error:
                {
                  code: ACTIVATION_TOKEN_EXPIRED,
                  message: This activation link has expired.,
                  correlationId: 5c1f2a9e,
                },
            }
    ValidationFailed:
      description: Request body or parameters failed validation, or a non-editable field was supplied.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            field:
              value:
                error:
                  code: VALIDATION_FAILED
                  message: One or more fields are invalid.
                  correlationId: 5c1f2a9e
                  details:
                    - {
                        field: email,
                        code: EMAIL_DOMAIN_NOT_ALLOWED,
                        message: Use your NUS email address.,
                      }
            protectedField:
              value:
                error:
                  code: VALIDATION_FAILED
                  message: One or more fields are invalid.
                  correlationId: 5c1f2a9e
                  details:
                    - {
                        field: roles,
                        code: FIELD_NOT_EDITABLE,
                        message: This field cannot be changed.,
                      }
    RateLimited:
      description: Too many attempts.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            {
              error:
                {
                  code: RATE_LIMITED,
                  message: Too many attempts. Try again later.,
                  correlationId: 5c1f2a9e,
                },
            }
    DependencyUnavailable:
      description: Database or another dependency is unavailable. Callers must fail closed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            {
              error:
                {
                  code: DEPENDENCY_UNAVAILABLE,
                  message: Try again shortly.,
                  correlationId: 5c1f2a9e,
                },
            }
