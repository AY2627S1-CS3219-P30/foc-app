openapi: 3.1.0
info:
  title: FoC Order Service API
  version: 1.0.0
  summary: Errand lifecycle API.
servers:
  - url: http://localhost:3003
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /orders/{orderId}:
    get:
      operationId: getOrder
      summary: Read the caller-authorized projection of one errand.
      description: |
        Exact delivery instructions and participant IDs are returned only to the requester,
        assigned courier, or the administrator specifically named by a referral. Other students
        and unrelated administrators receive the open-list projection. Pending-credit and rejected
        errands are private to their requester; other callers receive the same 404 as an unknown ID.
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: view
          in: query
          required: false
          description: Request private participant detail; unauthorized callers receive 403.
          schema: { type: string, enum: [private] }
      responses:
        '200':
          description: The authorized order projection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/InvalidOrderId' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PrivateForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders:
    get:
      operationId: listOpenOrders
      summary: Discover currently acceptable errands.
      description: Returns only unexpired OPEN orders and never exposes delivery instructions or participant IDs.
      responses:
        '200':
          description: Privacy-safe open-order summaries ordered by acceptance deadline.
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items: { $ref: '#/components/schemas/OpenOrderSummary' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      operationId: createOrder
      summary: Submit an errand for asynchronous credit reservation.
      description: |
        Validates the request and active supplier first, then commits a private PENDING_CREDIT
        errand and its reservation request in one transaction. Repeating the same requester-scoped
        Idempotency-Key with the same body returns the original order.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrder' }
      responses:
        '201':
          description: New PENDING_CREDIT order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '200':
          description: Exact result of an idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/InvalidOrder' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /orders/{orderId}/accept:
    post:
      operationId: acceptOrder
      summary: Atomically accept an OPEN errand.
      description: |
        One conditional database update checks OPEN state, expected version, requester inequality,
        and the live deadline. It chooses one courier under contention and emits one status event.
        No Credit balance is consulted.
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptOrder' }
      responses:
        '201':
          description: The accepted order with participant detail for its courier.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/InvalidOrderId' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AcceptanceForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/AcceptanceConflict' }
        '422': { $ref: '#/components/responses/InvalidOrder' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Health:
      type: object
      required: [status, service, version, uptimeSeconds]
      properties:
        status: { type: string, const: ok }
        service: { type: string, const: order-service }
        version: { type: string }
        uptimeSeconds: { type: number, minimum: 0 }
    SupplierSnapshot:
      type: object
      required: [supplierId, name, type, building, floor, locationDescription]
      properties:
        supplierId: { type: string, format: uuid }
        name: { type: string }
        type: { type: string }
        building: { type: string }
        floor: { type: string }
        locationDescription: { type: string }
    OrderItem:
      type: object
      required: [name, quantity]
      properties:
        name: { type: string }
        quantity: { type: integer, minimum: 1 }
        note: { type: string }
    Order:
      type: object
      required:
        - orderId
        - supplier
        - items
        - deliveryZone
        - reward
        - status
        - version
        - acceptanceDeadlineAt
        - createdAt
        - updatedAt
      properties:
        orderId: { type: string, format: uuid }
        supplier: { $ref: '#/components/schemas/SupplierSnapshot' }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OrderItem' }
        deliveryZone: { type: string }
        reward: { type: integer, minimum: 1, maximum: 5 }
        status:
          type: string
          enum:
            - PENDING_CREDIT
            - OPEN
            - ACCEPTED
            - PICKED_UP
            - DELIVERED
            - DISPUTED
            - COMPLETION_PENDING_CREDIT
            - RELEASE_PENDING_CREDIT
            - REJECTED
            - COMPLETED
            - CANCELLED
            - EXPIRED
        version: { type: integer, minimum: 1 }
        acceptanceDeadlineAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        requesterId: { type: string }
        courierId: { type: string }
        deliveryInstructions: { type: string }
        rejection:
          type: object
          required: [reason]
          properties:
            reason: { type: string }
            available: { type: integer, minimum: 0 }
    CreateOrder:
      type: object
      additionalProperties: false
      required: [supplierId, items, deliveryZone, deliveryInstructions, reward]
      properties:
        supplierId: { type: string, format: uuid }
        items:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/OrderItem' }
        deliveryZone: { type: string, minLength: 1, maxLength: 200 }
        deliveryInstructions: { type: string, minLength: 1, maxLength: 1000 }
        reward: { type: integer, minimum: 1, maximum: 5 }
    OpenOrderSummary:
      type: object
      required: [orderId, supplier, itemSummary, deliveryZone, reward, status, version, acceptanceDeadlineAt, timeRemainingSeconds, createdAt]
      properties:
        orderId: { type: string, format: uuid }
        supplier: { $ref: '#/components/schemas/SupplierSnapshot' }
        itemSummary:
          type: array
          items:
            type: object
            required: [name, quantity]
            properties:
              name: { type: string }
              quantity: { type: integer, minimum: 1 }
        deliveryZone: { type: string }
        reward: { type: integer, minimum: 1, maximum: 5 }
        status: { type: string, const: OPEN }
        version: { type: integer, minimum: 1 }
        acceptanceDeadlineAt: { type: string, format: date-time }
        timeRemainingSeconds: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
    AcceptOrder:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlationId]
          properties:
            code: { type: string }
            message: { type: string }
            correlationId: { type: string }
  responses:
    BadRequest:
      description: Missing or malformed Idempotency-Key.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    InvalidOrderId:
      description: The order ID is not a UUID.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthenticated:
      description: Missing, invalid, expired, logged-out, or inactive session.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: The order is unknown or not visible to this caller.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    PrivateForbidden:
      description: The caller is not a participant or the administrator named by the referral.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    AcceptanceForbidden:
      description: The caller is suspended or is the requester attempting self-acceptance.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    AcceptanceConflict:
      description: The order is not OPEN, changed version, was already won, or its deadline passed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    InvalidOrder:
      description: Invalid fields, inactive/unknown supplier, or conflicting idempotency reuse.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    DependencyUnavailable:
      description: Supplier verification is temporarily unavailable or invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
