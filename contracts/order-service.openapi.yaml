openapi: 3.1.0
info:
  title: FoC Order Service API
  version: 1.0.0
  summary: Errand lifecycle API.
servers:
  - url: http://localhost:3003
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /orders/mine:
    get:
      operationId: listMyOrders
      summary: List the caller's own errands.
      description: |
        Errands the caller requested or is the current courier of, in any status, most recently
        changed first, at most 100 (no paging yet); `truncated` is true when more were left out. Each
        carries the caller's private projection and `myRole`. A courier who withdrew or timed out no
        longer holds the errand and does not see it.
      responses:
        '200':
          description: The caller's errands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyOrders' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /orders/{orderId}:
    get:
      operationId: getOrder
      summary: Read the caller-authorized projection of one errand.
      description: |
        Exact delivery instructions and participant IDs are returned only to the requester,
        assigned courier, or the administrator specifically named by a referral. Other students
        and unrelated administrators receive the open-list projection. Pending-credit and rejected
        errands are private to their requester; other callers receive the same 404 as an unknown ID.
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: view
          in: query
          required: false
          description: Request private participant detail; unauthorized callers receive 403.
          schema: { type: string, enum: [private] }
      responses:
        '200':
          description: The authorized order projection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/InvalidOrderId' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PrivateForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders:
    get:
      operationId: listOpenOrders
      summary: Discover currently acceptable errands.
      description: Returns only unexpired OPEN orders and never exposes delivery instructions or participant IDs.
      responses:
        '200':
          description: Privacy-safe open-order summaries ordered by acceptance deadline.
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items: { $ref: '#/components/schemas/OpenOrderSummary' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      operationId: createOrder
      summary: Submit an errand for asynchronous credit reservation.
      description: |
        Validates the request and active supplier first, then commits a private PENDING_CREDIT
        errand and its reservation request in one transaction. Repeating the same requester-scoped
        Idempotency-Key with the same body returns the original order.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrder' }
      responses:
        '201':
          description: New PENDING_CREDIT order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '200':
          description: Exact result of an idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/InvalidOrder' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /orders/{orderId}/accept:
    post:
      operationId: acceptOrder
      summary: Atomically accept an OPEN errand.
      description: |
        One conditional database update checks OPEN state, expected version, requester inequality,
        and the live deadline. It chooses one courier under contention and emits one status event.
        No Credit balance is consulted.
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptOrder' }
      responses:
        '201':
          description: The accepted order with participant detail for its courier.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/InvalidOrderId' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AcceptanceForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/AcceptanceConflict' }
        '422': { $ref: '#/components/responses/InvalidOrder' }
  /orders/{orderId}/pickup:
    post:
      operationId: recordPickup
      summary: Assigned courier records pickup (ACCEPTED → PICKED_UP).
      description: |
        Only the assigned courier may record pickup, and only from ACCEPTED at the stated version.
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LifecycleCommand' }
      responses:
        '200':
          description: The order after the transition, projected for the caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/InvalidOrderId' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ActionForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/LifecycleConflict' }
        '422': { $ref: '#/components/responses/InvalidOrder' }
  /orders/{orderId}/deliver:
    post:
      operationId: recordDelivery
      summary: Assigned courier records delivery (PICKED_UP → DELIVERED).
      description: |
        Only the assigned courier may record delivery, and only from PICKED_UP at the stated version.
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LifecycleCommand' }
      responses:
        '200':
          description: The order after the transition, projected for the caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/InvalidOrderId' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ActionForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/LifecycleConflict' }
        '422': { $ref: '#/components/responses/InvalidOrder' }
  /orders/{orderId}/confirm-receipt:
    post:
      operationId: confirmReceipt
      summary: Requester confirms receipt (DELIVERED → COMPLETION_PENDING_CREDIT).
      description: |
        Only the requester may confirm. The order waits in COMPLETION_PENDING_CREDIT, unchangeable by
        any participant, administrator or timer, until the Credit Service confirms the transfer
        requested by the `order.completion-requested` event written in the same transaction.
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LifecycleCommand' }
      responses:
        '200':
          description: The order after the transition, projected for the caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/InvalidOrderId' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ActionForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/LifecycleConflict' }
        '422': { $ref: '#/components/responses/InvalidOrder' }
  /orders/{orderId}/cancel:
    post:
      operationId: cancelOrder
      summary: Requester cancels an OPEN or ACCEPTED errand before pickup.
      description: |
        Moves the errand to RELEASE_PENDING_CREDIT (reason cancelled) and writes
        `order.release-requested` in the same transaction. It becomes CANCELLED only when the Credit
        Service confirms the release. PICKED_UP and later states refuse cancellation with 409.
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LifecycleCommand' }
      responses:
        '200':
          description: The order after the transition, projected for the caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/InvalidOrderId' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ActionForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/LifecycleConflict' }
        '422': { $ref: '#/components/responses/InvalidOrder' }
  /orders/{orderId}/withdraw:
    post:
      operationId: withdrawFromOrder
      summary: Assigned courier withdraws before pickup.
      description: |
        The courier is removed. Before the acceptance deadline the errand returns to OPEN with its
        deadline unchanged; after it, the errand moves to RELEASE_PENDING_CREDIT (reason expired) and
        requests one release of the reward.
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LifecycleCommand' }
      responses:
        '200':
          description: The order after the transition, projected for the caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/InvalidOrderId' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ActionForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/LifecycleConflict' }
        '422': { $ref: '#/components/responses/InvalidOrder' }
  /orders/{orderId}/history:
    get:
      operationId: getOrderHistory
      summary: Read the private status history of an errand.
      description: |
        Every status change with its previous and new status, action, actor and time (OS-FR7.1.2).
        Readable only by the requester, the current courier and the administrator named by a
        referral; a former courier is an unrelated student. Hidden (pending/rejected) errands are
        a 404 for everyone else.
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The history, oldest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderHistory' }
        '400': { $ref: '#/components/responses/InvalidOrderId' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PrivateForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/orders/reconciliation-attempts:
    get:
      operationId: listReconciliationAttempts
      summary: Operator view of recent credit reconciliation decisions (CRD-07).
      description: |
        The 100 most recent decisions, newest first. Each records what Order and Credit each held
        and what the job did: REISSUED (the same idempotent request written to the outbox again),
        ALERTED (a contradiction raised as CREDIT_STATE_CONFLICT) or CREDIT_UNAVAILABLE.
        Administrators only.
      responses:
        '200':
          description: Recent attempts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconciliationAttempts' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminOnly' }
  /admin/orders/pending-credit:
    get:
      operationId: listCreditWaitExceeded
      summary: Operator view of errands waiting for the Credit Service too long.
      description: |
        Errands still in PENDING_CREDIT after CREDIT_WAIT_TIMEOUT_MS (5 minutes by default,
        OS-FR1.1.3), oldest first, with when the operator alert was raised. Listing an errand does not
        reject it; it still opens if the reservation arrives. Administrators only.
      responses:
        '200':
          description: Waiting errands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditWaitList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminOnly' }
  /admin/orders/alerts:
    get:
      operationId: listOperatorAlerts
      summary: Operator alerts across every errand (PLT-05).
      description: |
        `CREDIT_WAIT_EXCEEDED` (an errand waited for Credit past CREDIT_WAIT_TIMEOUT_MS) and
        `CREDIT_STATE_CONFLICT` (Credit's record disagrees with the errand's), newest first, at most
        100. Administrators only.
      responses:
        '200':
          description: Alerts, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatorAlertList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminOnly' }
  /admin/orders/{orderId}/timeline:
    get:
      operationId: getOrderTimeline
      summary: Reconstruct one errand from its ID (PLT-05, EI-NFR4.1.1).
      description: |
        Everything the Order Service recorded about one errand: its state changes, every event it
        caused and how sending each went, reconciliation decisions, operator alerts, and any dead
        letter about it. Credit's half is `GET /admin/orders/{orderId}/credit` on the Credit Service.
        Administrators only.
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The errand's timeline.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderTimeline' }
        '400': { $ref: '#/components/responses/InvalidOrderId' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/dead-letters:
    get:
      operationId: listDeadLetters
      summary: Find this service's dead letters (PLT-05).
      description: |
        Events this service's consumers could not handle after every retry, parked for an operator,
        newest first. `q` matches a correlation ID, an aggregate (order or user) ID or an event ID
        exactly. Administrators only.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [WAITING, REDRIVEN] } }
        - { name: queue, in: query, schema: { type: string, minLength: 1, maxLength: 200 } }
        - { name: q, in: query, schema: { type: string, minLength: 1, maxLength: 200 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
      responses:
        '200':
          description: One page of dead letters.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeadLetterPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminOnly' }
        '422': { $ref: '#/components/responses/DeadLetterInvalid' }
  /admin/dead-letters/{id}:
    get:
      operationId: getDeadLetter
      summary: Inspect one dead letter, with the message it carried.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The dead letter, its body and headers as received.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeadLetterDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminOnly' }
        '404': { $ref: '#/components/responses/DeadLetterNotFound' }
  /admin/dead-letters/{id}/redrive:
    post:
      operationId: redriveDeadLetter
      summary: Deliver a dead letter again, unchanged, to the queue it failed on.
      description: |
        Publishes the stored bytes and properties to the queue the message failed on, and nowhere
        else, with its attempts started again. The payload cannot be edited. Recorded with who did it
        and why once the broker confirms. A dead letter is redriven once; if it fails again, it comes
        back as a new one. The consumer's inbox makes a repeated delivery harmless.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Redriven. The dead letter, now REDRIVEN.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeadLetter' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminOnly' }
        '404': { $ref: '#/components/responses/DeadLetterNotFound' }
        '409': { $ref: '#/components/responses/AlreadyRedriven' }
        '422': { $ref: '#/components/responses/DeadLetterInvalid' }
        '503': { $ref: '#/components/responses/BrokerUnavailable' }
  /orders/{orderId}/receipt:
    get:
      operationId: getOrderReceipt
      summary: Read the immutable completion receipt.
      description: |
        Available once the Credit Service has confirmed the transfer. Readable by the requester,
        the courier, and the administrator named by a referral.
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The receipt, including the Credit Service transaction reference.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderReceipt' }
        '400': { $ref: '#/components/responses/InvalidOrderId' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PrivateForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Health:
      type: object
      required: [status, service, version, uptimeSeconds]
      properties:
        status: { type: string, const: ok }
        service: { type: string, const: order-service }
        version: { type: string }
        uptimeSeconds: { type: number, minimum: 0 }
    SupplierSnapshot:
      type: object
      required: [supplierId, name, type, building, floor, locationDescription]
      properties:
        supplierId: { type: string, format: uuid }
        name: { type: string }
        type: { type: string }
        building: { type: string }
        floor: { type: string }
        locationDescription: { type: string }
    OrderItem:
      type: object
      required: [name, quantity]
      properties:
        name: { type: string }
        quantity: { type: integer, minimum: 1 }
        note: { type: string }
    Order:
      type: object
      required:
        - orderId
        - supplier
        - items
        - deliveryZone
        - reward
        - status
        - version
        - acceptanceDeadlineAt
        - createdAt
        - updatedAt
      properties:
        orderId: { type: string, format: uuid }
        supplier: { $ref: '#/components/schemas/SupplierSnapshot' }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OrderItem' }
        deliveryZone: { type: string }
        reward: { type: integer, minimum: 1, maximum: 5 }
        status:
          type: string
          enum:
            - PENDING_CREDIT
            - OPEN
            - ACCEPTED
            - PICKED_UP
            - DELIVERED
            - DISPUTED
            - COMPLETION_PENDING_CREDIT
            - RELEASE_PENDING_CREDIT
            - REJECTED
            - COMPLETED
            - CANCELLED
            - EXPIRED
        version: { type: integer, minimum: 1 }
        acceptanceDeadlineAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        requesterId: { type: string }
        courierId: { type: string }
        deliveryInstructions: { type: string }
        rejection:
          type: object
          required: [reason]
          properties:
            reason: { type: string }
            available: { type: integer, minimum: 0 }
    MyOrders:
      type: object
      required: [items, truncated]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            allOf:
              - $ref: '#/components/schemas/Order'
              - type: object
                required: [myRole]
                properties:
                  myRole: { type: string, enum: [REQUESTER, COURIER] }
        truncated:
          type: boolean
          description: True when the caller has more than 100 errands and the oldest were left out.
    CreateOrder:
      type: object
      additionalProperties: false
      required: [supplierId, items, deliveryZone, deliveryInstructions, reward]
      properties:
        supplierId: { type: string, format: uuid }
        items:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/OrderItem' }
        deliveryZone: { type: string, minLength: 1, maxLength: 200 }
        deliveryInstructions: { type: string, minLength: 1, maxLength: 1000 }
        reward: { type: integer, minimum: 1, maximum: 5 }
    OpenOrderSummary:
      type: object
      required:
        [
          orderId,
          supplier,
          itemSummary,
          deliveryZone,
          reward,
          status,
          version,
          acceptanceDeadlineAt,
          timeRemainingSeconds,
          createdAt,
        ]
      properties:
        orderId: { type: string, format: uuid }
        supplier: { $ref: '#/components/schemas/SupplierSnapshot' }
        itemSummary:
          type: array
          items:
            type: object
            required: [name, quantity]
            properties:
              name: { type: string }
              quantity: { type: integer, minimum: 1 }
        deliveryZone: { type: string }
        reward: { type: integer, minimum: 1, maximum: 5 }
        status: { type: string, const: OPEN }
        version: { type: integer, minimum: 1 }
        acceptanceDeadlineAt: { type: string, format: date-time }
        timeRemainingSeconds: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
    AcceptOrder:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
    LifecycleCommand:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
    OrderReceipt:
      type: object
      required: [orderId, requesterId, courierId, supplier, reward, creditTransactionId, timestamps]
      properties:
        orderId: { type: string, format: uuid }
        requesterId: { type: string }
        courierId: { type: string }
        supplier: { $ref: '#/components/schemas/SupplierSnapshot' }
        reward: { type: integer, minimum: 1, maximum: 5 }
        creditTransactionId: { type: string, format: uuid }
        timestamps:
          type: object
          required:
            [createdAt, acceptedAt, pickedUpAt, deliveredAt, completionRequestedAt, completedAt]
          properties:
            createdAt: { type: string, format: date-time }
            acceptedAt: { type: string, format: date-time }
            pickedUpAt: { type: string, format: date-time }
            deliveredAt: { type: string, format: date-time }
            completionRequestedAt: { type: string, format: date-time }
            completedAt: { type: string, format: date-time }
    OrderHistory:
      type: object
      required: [orderId, entries]
      properties:
        orderId: { type: string, format: uuid }
        entries:
          type: array
          items:
            type: object
            required: [previousStatus, newStatus, action, actorType, actorId, version, occurredAt]
            properties:
              previousStatus: { type: [string, 'null'] }
              newStatus: { type: string }
              action: { type: string }
              actorType: { type: string }
              actorId: { type: [string, 'null'] }
              version: { type: integer, minimum: 1 }
              occurredAt: { type: string, format: date-time }
    ReconciliationAttempts:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required:
              [
                attemptId,
                runId,
                orderId,
                orderStatus,
                orderVersion,
                creditStatus,
                creditDetail,
                action,
                reissuedEventId,
                attemptedAt,
              ]
            properties:
              attemptId: { type: string, format: uuid }
              runId: { type: string, format: uuid }
              orderId: { type: string, format: uuid }
              orderStatus: { type: string }
              orderVersion: { type: integer }
              creditStatus:
                { type: [string, 'null'], enum: [NONE, RESERVED, RELEASED, TRANSFERRED, null] }
              creditDetail: { type: [string, 'null'] }
              action: { type: string, enum: [REISSUED, ALERTED, CREDIT_UNAVAILABLE] }
              reissuedEventId: { type: [string, 'null'], format: uuid }
              attemptedAt: { type: string, format: date-time }
    CreditWaitList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [orderId, requesterId, reward, createdAt, waitingMs, alertRaisedAt]
            properties:
              orderId: { type: string, format: uuid }
              requesterId: { type: string }
              reward: { type: integer }
              createdAt: { type: string, format: date-time }
              waitingMs: { type: number, minimum: 0 }
              alertRaisedAt: { type: [string, 'null'], format: date-time }
    OperatorAlert:
      type: object
      required: [kind, raisedAt, detail]
      properties:
        kind: { type: string, enum: [CREDIT_WAIT_EXCEEDED, CREDIT_STATE_CONFLICT] }
        raisedAt: { type: string, format: date-time }
        detail: { description: What the alert recorded when it was raised. }
    OperatorAlertList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            allOf:
              - { $ref: '#/components/schemas/OperatorAlert' }
              - type: object
                required: [orderId]
                properties:
                  orderId: { type: string, format: uuid }
    OrderTimeline:
      type: object
      required:
        [
          orderId,
          status,
          requesterId,
          courierId,
          reward,
          version,
          creditTransactionId,
          createdAt,
          updatedAt,
          history,
          events,
          reconciliation,
          alerts,
          deadLetters,
        ]
      properties:
        orderId: { type: string, format: uuid }
        status: { type: string }
        requesterId: { type: string }
        courierId: { type: [string, 'null'] }
        reward: { type: integer }
        version: { type: integer }
        creditTransactionId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        history:
          type: array
          items:
            type: object
            required: [previousStatus, newStatus, action, actorType, actorId, version, occurredAt]
            properties:
              previousStatus: { type: [string, 'null'] }
              newStatus: { type: string }
              action: { type: string }
              actorType: { type: string }
              actorId: { type: [string, 'null'] }
              version: { type: integer }
              occurredAt: { type: string, format: date-time }
        events:
          description: Every event the errand caused, sent or still waiting in the outbox.
          type: array
          items:
            type: object
            required:
              [
                eventId,
                eventType,
                correlationId,
                causationId,
                occurredAt,
                publishedAt,
                attempts,
                lastError,
              ]
            properties:
              eventId: { type: string, format: uuid }
              eventType: { type: string }
              correlationId: { type: string }
              causationId: { type: [string, 'null'] }
              occurredAt: { type: string, format: date-time }
              publishedAt: { type: [string, 'null'], format: date-time }
              attempts: { type: integer, minimum: 0 }
              lastError: { type: [string, 'null'] }
        reconciliation:
          type: array
          items:
            type: object
            required:
              [attemptId, runId, orderStatus, creditStatus, action, reissuedEventId, attemptedAt]
            properties:
              attemptId: { type: string }
              runId: { type: string }
              orderStatus: { type: string }
              creditStatus: { type: [string, 'null'] }
              action: { type: string }
              reissuedEventId: { type: [string, 'null'] }
              attemptedAt: { type: string, format: date-time }
        alerts:
          type: array
          items: { $ref: '#/components/schemas/OperatorAlert' }
        deadLetters:
          type: array
          items: { $ref: '#/components/schemas/DeadLetter' }
    DeadLetter:
      type: object
      required:
        [
          id,
          queue,
          eventId,
          eventType,
          aggregateId,
          correlationId,
          failureReason,
          attempts,
          status,
          parkedAt,
          redrivenAt,
          redrivenBy,
          redriveReason,
        ]
      properties:
        id: { type: string, format: uuid }
        queue:
          {
            type: string,
            description: The queue whose consumer failed,
            which a redrive delivers to.,
          }
        eventId: { type: [string, 'null'] }
        eventType: { type: [string, 'null'] }
        aggregateId: { type: [string, 'null'], description: The order or user the event is about. }
        correlationId: { type: [string, 'null'] }
        failureReason: { type: [string, 'null'] }
        attempts: { type: integer, minimum: 1 }
        status: { type: string, enum: [WAITING, REDRIVEN] }
        parkedAt: { type: string, format: date-time }
        redrivenAt: { type: [string, 'null'], format: date-time }
        redrivenBy: { type: [string, 'null'] }
        redriveReason: { type: [string, 'null'] }
    DeadLetterDetail:
      allOf:
        - { $ref: '#/components/schemas/DeadLetter' }
        - type: object
          required: [body, headers]
          properties:
            body:
              { description: The message as received, parsed when it is JSON, its text otherwise. }
            headers: { type: object, additionalProperties: true }
    DeadLetterPage:
      type: object
      required: [page, pageSize, total, items]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        items:
          type: array
          items: { $ref: '#/components/schemas/DeadLetter' }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlationId]
          properties:
            code: { type: string }
            message: { type: string }
            correlationId: { type: string }
  responses:
    BadRequest:
      description: Missing or malformed Idempotency-Key.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    InvalidOrderId:
      description: The order ID is not a UUID.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthenticated:
      description: Missing, invalid, expired, logged-out, or inactive session.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: The order is unknown or not visible to this caller.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    PrivateForbidden:
      description: The caller is not a participant or the administrator named by the referral.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    AcceptanceForbidden:
      description: The caller is suspended or is the requester attempting self-acceptance.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    AcceptanceConflict:
      description: The order is not OPEN, changed version, was already won, or its deadline passed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    InvalidOrder:
      description: Invalid fields, inactive/unknown supplier, or conflicting idempotency reuse.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    AdminOnly:
      description: The caller is not an administrator.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ActionForbidden:
      description: |
        This caller may never perform this action on this order (for example, a requester recording
        pickup). `details` carries the current status and version. Nothing changes.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    LifecycleConflict:
      description: |
        `INVALID_ORDER_STATE` (the order is not in a state that allows this action) or
        `ORDER_CHANGED` (stale expectedVersion). `details` carries the current status and version.
        Nothing changes.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    DependencyUnavailable:
      description: Supplier verification is temporarily unavailable or invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    DeadLetterNotFound:
      description: No dead letter has this ID.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    DeadLetterInvalid:
      description: '`VALIDATION_FAILED`: an unknown or malformed filter, or a redrive without a reason.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    AlreadyRedriven:
      description: '`ALREADY_REDRIVEN`: if it failed again, it is waiting as a new dead letter.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    BrokerUnavailable:
      description: '`BROKER_UNAVAILABLE`: the message broker is not connected. Nothing was sent.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
