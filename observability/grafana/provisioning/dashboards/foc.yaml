# Loads every dashboard in /etc/grafana/dashboards (observability/grafana/dashboards
# in the repo). Edit the JSON there: changes made in the UI are not saved.
apiVersion: 1
providers:
  - name: foc
    folder: FoC
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboards
