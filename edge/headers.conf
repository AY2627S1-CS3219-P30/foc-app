# Security headers for every response the edge sends (PLT-10, ADR 0010). Included at the server
# level, and again in any location that adds a header of its own: nginx drops the inherited
# add_header lines in a block that has one.
#
# Next.js writes inline scripts and styles, hence 'unsafe-inline' for both. Images may come from
# any HTTPS address, as a supplier's photo does. Everything the app fetches is on this origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
