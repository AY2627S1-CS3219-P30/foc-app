# The edge (PLT-10, #285; ADR 0010): one origin for the browser. It routes and protects only:
# each service still authenticates every request itself, and nothing here vouches for a caller.
#
#   /api/user/     -> user-service:3001      /api/order/   -> order-service:3003
#   /api/supplier/ -> supplier-service:3002  /api/credit/  -> credit-service:3004
#   anything else  -> web-app:3000           /internal and /metrics: never
#   /edge/health   -> the edge itself         /edge/ready: the whole stack (readiness.js)
#   /api/order/live -> order-service:3003, the live-update stream, unbuffered (ADR 0011)
#
# The prefix is taken off before the request goes on, so a service sees the paths it always
# has. Runs as nginx's unprivileged user on a read-only file system; /tmp is its scratch space.

# nginx's JavaScript module, for the readiness answer, which asks several upstreams at once.
load_module modules/ngx_http_js_module.so;

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  # A live-update stream holds two connections for its whole life, one to the browser and one to
  # the Order Service (ADR 0011), so a few hundred open tabs must not use up ordinary requests'.
  worker_connections 4096;
}

http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;

  # Docker's DNS, asked again every 10 s, so a container that was recreated (and got a new
  # address) is found without restarting the edge.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 2s;

  js_path /etc/nginx/foc;
  js_import readiness from readiness.js;
  # A service takes up to 2 s to ask its own dependencies; one slower than this counts as down.
  js_fetch_timeout 3s;

  # The browser's correlation ID when it sent a usable one, the edge's own otherwise, so a
  # request is logged under one ID here and in every service it reaches (PLT-04).
  map $http_x_correlation_id $correlation_id {
    "~^[A-Za-z0-9._:-]{1,128}$" $http_x_correlation_id;
    default $request_id;
  }

  log_format edge escape=json '{"time":"$time_iso8601","method":"$request_method",'
    '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
    '"durationS":$request_time,"upstream":"$upstream_addr","correlationId":"$correlation_id"}';
  access_log /dev/stdout edge;

  # Writes are limited per client address; reads are not. A burst covers a person clicking
  # quickly and the browser journeys, which run from one machine.
  map $request_method $write_client {
    GET "";
    HEAD "";
    OPTIONS "";
    default $binary_remote_addr;
  }
  limit_req_zone $write_client zone=writes:10m rate=10r/s;
  limit_req_status 429;

  # Live-update streams held open per client address (N1.4); one per tab, so ten is generous.
  limit_conn_zone $binary_remote_addr zone=streams:10m;

  # The path after /api/<service>, exactly as the browser sent it, query string included.
  map $request_uri $api_path {
    "~^/api/[a-z]+(?<rest>/.*)$" $rest;
    default "/";
  }

  server {
    listen 8080;
    server_name _;

    include /etc/nginx/foc/headers.conf;
    limit_req zone=writes burst=30 nodelay;
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # The address the edge saw, replacing whatever the client claimed: each service believes
    # this header from the edge alone (TRUSTED_PROXY=edge) for its per-address limits.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $correlation_id;

    error_page 429 = @rate_limited;
    error_page 413 = @too_large;

    location = /edge/health {
      default_type text/plain;
      return 200 "ok\n";
    }

    # The whole stack: 200 only while the web app and all four services answer their health
    # checks, 503 naming each that does not (PLT-13). The edge's own health check asks this.
    location = /edge/ready {
      js_content readiness.check;
    }

    # Never the services' internal API or their metrics, however the path is spelled: a regex
    # location is matched on nginx's normalised path, and before the prefix locations below. It
    # ignores case (~*), as the services' routes do, so /api/order/Metrics is refused too.
    location ~* ^/api/[a-z]+/(internal|metrics)(/|$) {
      default_type application/json;
      return 404 '{"error":{"code":"NOT_FOUND","message":"Not found.","correlationId":"$correlation_id"}}';
    }

    location /api/user/ {
      set $upstream user-service:3001;
      proxy_pass http://$upstream$api_path;
      # The refresh cookie is set for /auth, the path the service serves; the browser reaches
      # it at /api/user/auth, so the cookie must say that or the browser never sends it back.
      proxy_cookie_path /auth /api/user/auth;
      error_page 502 504 =503 @unavailable;
    }

    location /api/supplier/ {
      set $upstream supplier-service:3002;
      proxy_pass http://$upstream$api_path;
      error_page 502 504 =503 @unavailable;
    }

    # N1.4 (#329, #330; ADR 0011): the live-update stream. An exact match, so it is chosen over
    # the /api/order/ prefix. Passed on as it is written (the service also says so, with
    # X-Accel-Buffering), kept open past the 20 s keep-alives, and held at most ten per address,
    # refused as the service refuses its own cap, so the page polls and asks again in a minute.
    location = /api/order/live {
      limit_conn streams 10;
      limit_conn_status 429;
      error_page 429 = @too_many_streams;
      set $upstream order-service:3003;
      proxy_pass http://$upstream$api_path;
      proxy_buffering off;
      proxy_read_timeout 90s;
      error_page 502 504 =503 @unavailable;
    }

    location /api/order/ {
      set $upstream order-service:3003;
      proxy_pass http://$upstream$api_path;
      error_page 502 504 =503 @unavailable;
    }

    location /api/credit/ {
      set $upstream credit-service:3004;
      proxy_pass http://$upstream$api_path;
      error_page 502 504 =503 @unavailable;
    }

    # A service the edge does not know.
    location /api/ {
      default_type application/json;
      return 404 '{"error":{"code":"NOT_FOUND","message":"Not found.","correlationId":"$correlation_id"}}';
    }

    location / {
      set $upstream web-app:3000;
      proxy_pass http://$upstream;
    }

    location @unavailable {
      include /etc/nginx/foc/headers.conf;
      add_header Retry-After 5 always;
      default_type application/json;
      return 503 '{"error":{"code":"UNAVAILABLE","message":"The service is not answering. Try again shortly.","correlationId":"$correlation_id"}}';
    }

    location @rate_limited {
      include /etc/nginx/foc/headers.conf;
      add_header Retry-After 1 always;
      default_type application/json;
      return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests. Try again in a moment.","correlationId":"$correlation_id"}}';
    }

    location @too_many_streams {
      include /etc/nginx/foc/headers.conf;
      add_header Retry-After 60 always;
      default_type application/json;
      return 429 '{"error":{"code":"TOO_MANY_STREAMS","message":"Too many live-update streams are open from this address.","correlationId":"$correlation_id"}}';
    }

    location @too_large {
      default_type application/json;
      return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"The request is too large.","correlationId":"$correlation_id"}}';
    }
  }
}
