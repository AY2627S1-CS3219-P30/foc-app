edgeCases:
  - id: EC1
    title: "A user's account is invalidated while mid-action"
    decision: "Before pickup, the errand is reassigned to reduce disruption to the other user; after pickup, it is referred to an administrator. The suspended user's access ends immediately."
    requirements: [US-FR3.1.2, US-NFR2.1.2, OS-FR8.1.1, OS-FR8.1.2, OS-FR8.1.3, CS-FR1.2.1]
    tests:
      - "order-service/test/participant-suspension.test.ts::reopens an errand whose courier is suspended before pickup, extending its deadline by the time they held it"
      - "order-service/test/participant-suspension.test.ts::refers an errand whose courier is suspended after pickup, keeping them on it"
      - "auth-client/test/status-events.test.ts::a suspension is enforced on the very next request, not after the cache window"
  - id: EC2
    title: "A supplier is deleted or edited while active errands reference it"
    decision: "Soft delete: a referenced supplier is deactivated rather than removed, disappearing from new searches; editing a supplier never changes an existing errand, which keeps the supplier's details as they were."
    requirements: [SS-FR2.1.2, SS-FR2.1.2.1, SS-NFR3.1.1, OS-FR2.1.3]
    tests:
      - "order-service/test/order-creation.test.ts::keeps the errand’s pickup as it was when the supplier is renamed, moved or deactivated"
      - "supplier-service/test/suppliers.test.ts::excludes a deactivated supplier from listings but keeps its row, fetchable by id"
      - "order-service/test/order-creation.test.ts::rejects an inactive supplier without writing an order"
  - id: EC3
    title: "The acceptance deadline passes while a courier holds the errand"
    decision: "A withdrawal or pickup timeout after the deadline expires the errand and returns the credits; a courier's suspension instead reopens it with the deadline extended by the time the courier held it."
    requirements: [OS-FR6.1.1, OS-FR6.1.2, OS-FR6.1.3, OS-FR8.1.1, OS-NFR3.1.1]
    tests:
      - "order-service/test/order-cancel-expiry.test.ts::expires a withdrawal after the deadline and returns the credits exactly once"
      - "order-service/test/order-cancel-expiry.test.ts::expires a timed-out pickup after the deadline and requests one release"
      - "order-service/test/participant-suspension.test.ts::reopens an errand whose courier is suspended before pickup, extending its deadline by the time they held it"
  - id: EC4
    title: "A failure between delivery confirmation and the credit transfer"
    decision: "The transfer is one database transaction, so a crash leaves both balances changed or neither; the completion request is redelivered until the transfer is recorded, and a repeat after a lost confirmation re-sends it without moving credits."
    requirements: [CS-FR4.1.1, CS-FR4.1.2, CS-NFR1.1.1, CS-NFR2.1.1, OS-FR5.1.1, EI-NFR1.1.1]
    tests:
      - "credit-service/test/terminal-operations.test.ts::rolls back the whole transfer when %s fails"
      - "credit-service/test/delivery.test.ts::a crash after the transfer commits, before it is acknowledged, moves no additional credits"
      - "credit-service/test/terminal-operations.test.ts::replays the recorded confirmation after the first confirmation is lost"
  - id: EC5
    title: "The only administrator tries to remove their own access"
    decision: "Refused: no administrator may remove their own role, accounts are suspended rather than deleted, and a change that would leave no active administrator is refused inside the same transaction."
    requirements: [US-FR3.1.3, US-FR3.1.3.1, US-FR3.1.2.2, US-NFR4.1.2]
    tests:
      - "user-service/test/admin.test.ts::forbids demoting yourself, seeded or appointed"
      - "user-service/test/admin.test.ts::never leaves zero administrators, even when two seeded admins demote each other at once"
      - "user-service/test/matrix.test.ts::deny by default: every registered route is either in the matrix or explicitly public"

feedback:
  - point: "Supplier records should match the template seed data: its types, floor and location description, not an address."
    answeredBy: [SS-FR1.1.1, SS-FR1.1.3, SS-FR4.1.1, "#125"]
  - point: "Suppliers should be sortable and retrievable by their identifier (D2 §2)."
    answeredBy: [SS-FR3.1.3, SS-FR3.2.1, "#117", "#126"]
  - point: "Product catalogues are out of scope; teams that added them were criticised."
    answeredBy: [SS-FR1.1.1, "#186"]
  - point: "How administrators are created, appointed and removed should be controlled."
    answeredBy: [US-FR3.1.3.1, US-FR3.1.3.2, US-FR3.1.3.3, docs/adr/0008-controlling-administrators.md, "#122"]
  - point: "How credentials are kept out of the logs."
    answeredBy: [US-NFR4.1.1, "#156"]
  - point: "The Order Service should not be coupled to the Credit Service: creating an errand must not depend on Credit answering at once."
    answeredBy: [OS-FR1.1.2, CS-FR3.1, docs/adr/0002-asynchronous-order-credit-saga.md, "#183"]
  - point: "What a student with zero credits can still do."
    answeredBy: [CS-FR3.1.3, "#138", "#158"]
  - point: "Teams blurred available, reserved and total credits."
    answeredBy: [CS-FR2.1.1, UI-FR4.1.2, "#158"]
  - point: "Credits transfer once the items are delivered and the delivery is confirmed; any other route to completion needs justifying."
    answeredBy: [OS-FR4.1.4, "#170"]
  - point: "What happens when a transfer succeeds but its confirmation is lost?"
    answeredBy: [CS-FR4.1.2, EI-NFR1.1.1, "#141", "#135"]
  - point: "How the Credit Service checks that a transfer matches the right errand, users and amount."
    answeredBy: [CS-NFR2.1.2, "#141"]
  - point: "How the requester is not charged twice and the courier not paid twice (idempotency: processing the same operation again moves no more credits)."
    answeredBy: [CS-NFR2.1.1, CS-FR4.1.2, "#141", "#153"]
  - point: "Each credit operation's trigger, and who initiates it."
    answeredBy: [EI-FR1.1.1, CS-FR1.1.1, "#133"]
  - point: "Show the transitions, not just the states: the action, the condition that must hold, and who may perform it."
    answeredBy: [order-service/README.md, "#129", "#130"]
  - point: "Several couriers accepting at once, or a requester accepting their own errand, are alternative workflows, not edge cases."
    answeredBy: [OS-FR3.1.1, OS-FR3.1.2, OS-NFR3.1.2, "#138"]
  - point: "When an errand expires, and what happens when the deadline passes after a courier has accepted it."
    answeredBy: [OS-FR6.1.1, OS-FR6.1.2, OS-FR8.1.1, "#148", "#149"]
  - point: "Edge cases should be genuine, and mapped to specific functional or non-functional requirements."
    answeredBy: ["#186", "#168"]
