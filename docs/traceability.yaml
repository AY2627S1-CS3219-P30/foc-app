      - "order-service/test/order-expiry.postgres.test.ts::never both accepts and expires an order racing its deadline"
      - "order-service/test/order-outcomes.postgres.test.ts::gives one outcome when a report, a confirmation and the timer land together"
      - "order-service/test/order-outcomes.test.ts::the timer, then confirm: the confirmation is refused"
  - id: OS-NFR3.1.3
    text: "The acceptance period (default 60 minutes), pickup timeout (default 30 minutes), late-delivery period (default 2 hours), and auto-confirmation period (default 24 hours) shall be adjustable per deployment without code changes."
    tests:
      - "order-service/test/order-cancel-expiry.test.ts::removes a courier who has not picked up within the configured timeout"
      - "order-service/test/order-outcomes.test.ts::saves each deadline when its period starts and shows it to the participants in that status"
    gap: "No test sets ACCEPTANCE_WINDOW_MS, DELIVERY_PERIOD_MS or AUTO_CONFIRM_MS to a new value and shows it takes effect. Only the pickup timeout is shown adjustable, and through the scheduler option rather than PICKUP_TIMEOUT_MS. The 60-minute acceptance default is never asserted."
  - id: OS-NFR4.1.1
    text: "If the service crashes after saving a status change but before notifying other services, the notification shall be sent after restart without repeating the status change."
    areas: [repeats]
    tests:
