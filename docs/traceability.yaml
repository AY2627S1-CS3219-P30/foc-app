      - "scripts-restart-check.sh::no table lost a row while Postgres was away"
    gap: "Nothing automated restores from the documented backup or measures the 24 h recovery point and 60 min recovery time; only restart/recreate survival is checked (PLT-09, #284, adds the backup, restore and drill)."
  - id: CS-NFR5.1.1
    text: "A student may view only their own wallet and history; an administrator's access shall be read-only and recorded; only verified platform services may cause a credit movement."
    areas: [roles]
    tests:
      - "credit-service/test/wallets.test.ts::exposes no route for a student to select another wallet"
      - "credit-service/test/wallets.test.ts::allows an admin read and appends an audit record"
      - "scripts-demo-failures.sh::and no wallet was created: no credits were minted"
  - id: CS-NFR5.1.2
    text: "The deployed system shall offer no way to purchase, withdraw, cash out, or set credits, or to move credits other than as part of an errand or an initial allocation."
    tests:
      - "credit-service/test/closed-economy.test.ts::contains only the four approved producer-scoped economic inputs"
      - "credit-service/test/closed-economy.test.ts::registers reads, redrive and ledger audit, with no balance mutation route"
      - "credit-service/test/operations.test.ts::moves no credit itself: a redrive only puts the stored message back on its queue"
  - id: EI-FR1.1.1
    text: "The asynchronous workflows shall be: creating a wallet after a student's first activation; sharing account suspensions and reactivations with the services that depend on them; reserving credits for a new errand before it opens; transferring credits after an errand is completed; returning credits after an errand is cancelled or expired; and sharing each errand status change with other services."
    areas: [reservations, transfers, returns]
    tests:
      - "system-tests/test/broker-replay.test.ts::completes and cancels with one effect each under duplicate publication and full replay"
      - "scripts-demo-journey.sh::the wallet arrived by itself: 10 available, 0 reserved"
      - "auth-client/test/status-events.test.ts::a suspension is enforced on the very next request, not after the cache window"
  - id: EI-FR1.1.2
    text: "A user action that starts an asynchronous workflow shall return its own result without waiting for the workflow to finish."
    tests:
      - "order-service/test/order-creation.test.ts::commits PENDING_CREDIT and both outbox facts while Credit is absent"
      - "scripts-demo-journey.sh::a student registered and activated while Credit was cut off: the User Service did not wait for it"
      - "scripts-demo-failures.sh::it waits as PENDING_CREDIT, hidden from couriers, with no credits moved"
  - id: EI-FR2.1.1
    text: "A step delivered more than once shall take effect once, and every repeat shall give the recorded outcome."
