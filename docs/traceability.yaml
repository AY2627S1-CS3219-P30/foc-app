      - "order-service/test/order-recovery.postgres.test.ts::republishes an event under the same ID after a SIGKILL mid-publish, so a consumer applies it once"
      - "order-service/test/order-creation.test.ts::delivers committed outbox rows after a simulated crash-before-publish restart"
