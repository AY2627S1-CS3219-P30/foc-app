  - id: CS-FR3.1.1
    text: "A reservation shall succeed only when the amount is one to five credits and the requester's available credits cover it; otherwise it shall be refused with the reason (for insufficient credits, with the available balance) and nothing shall change. A request for a requester whose wallet does not exist yet shall be retried under EI-NFR2.1.2 rather than refused."
