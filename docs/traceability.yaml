      - "order-service/test/order-recovery.postgres.test.ts::publishes every event committed before a SIGKILL, once, after restart, and the pending order reconciles"
      - "order-service/test/order-credit-wait.test.ts::surfaces an order waiting over 5 minutes to an operator once, and it still opens later"
    gap: "No test shows that a completion- or release-pending order is reconciled or surfaced within five minutes: the reconciliation tests age the order by an hour, and the 5-minute operator alert covers only PENDING_CREDIT."
  - id: OS-NFR5.1.1
    text: "Automated tests shall show that no unrelated student, including a courier who withdrew or was removed, can see exact delivery instructions, participant identities, or the private status history of an errand, and that an administrator can see them only for an errand referred to them."
