      - "docs/reports/credit-conservation-2026-10-01.md"
  - id: CS-NFR2.1.1
    text: "Sending the same reservation, transfer, or return request 100 times shall produce one balance change and return the recorded outcome for every repeat."
    areas: [repeats, reservations, transfers, returns]
    tests:
      - "credit-service/test/reservations.test.ts::applies 100 repeated business requests once and reproduces their success outcome"
      - "credit-service/test/terminal-operations.test.ts::applies 100 repeated requests once and republishes one identical recorded result"
      - "credit-service/test/terminal-operations.test.ts::applies 100 repeated requests once and republishes the recorded release"
  - id: CS-NFR2.1.2
    text: "A request that reuses an errand with a different requester, courier, amount, or kind of movement shall be refused without changing any balance and shall alert an operator."
    areas: [repeats, reservations, transfers, returns]
    tests:
      - "credit-service/test/reservations.test.ts::refuses conflicting facts for one order id and raises an audit alert"
      - "credit-service/test/terminal-operations.test.ts::audits a requester or amount mismatch without changing either wallet"
      - "credit-service/test/terminal-operations.test.ts::rejects release after transfer and transfer after release without a second effect"
    gap: "No test reuses an errand with only a different courier, and the different-kind-of-movement test checks balances but not that an operator alert was raised."
  - id: CS-NFR4.1.1
    text: "A daily reconciliation shall verify wallet balances against ledger totals, one live reservation at most per order, and matched requester and courier entries for each transfer; any mismatch shall raise an operator-visible failure."
    areas: [reservations, transfers]
    tests:
      - "credit-service/test/ledger-audit.test.ts::catches per-wallet drift even when platform conservation still holds; never repairs it"
      - "credit-service/test/ledger-audit.test.ts::detects a ledger row corrupted by an operator in an isolated test"
      - "credit-service/test/ledger-audit.test.ts::records at most one scheduled scan per UTC day, including across service instances"
    gap: "No audit test injects a second live reservation for one order, or a transfer with only one side recorded, to show those specific checks fire."
  - id: CS-NFR4.1.2
    text: "Committed wallet, transaction, and ledger records shall survive container restart and restore from the documented backup with a recovery point of at most 24 hours and recovery time of at most 60 minutes."
    tests:
      - "scripts-restart-check.sh::no table in any of the five databases lost a row"
