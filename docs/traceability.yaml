# The requirements traceability matrix (REL-02, #168; PL-NFR4.1.1). Every Must requirement of the
# D1 backlog (docs/Project D1 Submission.docx, as revised in #186), with the automated tests that
# prove it. Rendered as docs/traceability.md: after editing, run `npm run traceability -w test-harness`.
#
# tests:    path::title, where title is the exact title of an it( or test( in that file, or the
#           literal start of a `pass "` check in a bash script. CI checks every one exists.
# areas:    PL-NFR4.1.1's areas (roles, transitions, reservations, returns, transfers, repeats).
#           A requirement in one needs at least one test; evidence alone is not enough.
# evidence: repository paths of what proves it when no test does, such as a measured report.
# gap:      what is missing, when nothing automated proves it yet.

requirements:
  - id: US-FR1.1.1
    text: "Registration shall treat email addresses that differ only in letter case or surrounding spaces as the same, refuse an address outside the NUS email domains the platform is configured to allow, and refuse an address that is already registered, without creating an account."
    areas: [repeats]
    tests:
      - "user-service/test/registration.test.ts::rejects a duplicate email, including a case and whitespace variant, without a second row"
      - "user-service/test/registration.test.ts::rejects an off-domain email and creates nothing"
      - "user-service/test/registration.test.ts::lets exactly one of several simultaneous registrations for one email succeed"
  - id: US-FR1.1.2
    text: "Only an account with valid credentials shall be signed in, for a session of at most seven days; logging out shall end the current session."
    tests:
      - "user-service/test/sessions.test.ts::gives an unknown email and a wrong password the same response"
      - "user-service/test/sessions.test.ts::ends a session seven days after login, however often it refreshes (US-FR1.1.2)"
      - "user-service/test/sessions.test.ts::kills the refresh session and the access token immediately"
  - id: US-FR2.1.1
    text: "An active student shall be able to act as requester and as courier without a second account or a change of role by an administrator."
    areas: [roles]
    tests:
      - "order-service/test/my-errands.test.ts::lets a student with an open errand of their own deliver someone else’s"
      - "user-service/test/profile.test.ts::the requester↔courier switch changes the UI preference and no authorization decision (US-FR2.1.2)"
      - "user-service/test/internal-lookup.test.ts::grants order permissions to an active student, and no admin rights"
  - id: US-FR2.1.2
    text: "The platform shall make every permission decision for a user's action itself; a displayed value, or a role or identity claimed by the user's device, shall never decide what a user may do."
    areas: [roles]
    tests:
      - "user-service/test/matrix.test.ts::no client-supplied role, header or body field changes an outcome (US-NFR1.1.2)"
      - "user-service/test/profile.test.ts::the requester↔courier switch changes the UI preference and no authorization decision (US-FR2.1.2)"
      - "auth-client/test/nest-guards.test.ts::ignores any role a client claims in a header or body (US-NFR1.1.2)"
  - id: US-FR3.1.1
    text: "A student shall be able to view and update only their own display name, faculty, profile picture, contact preference, and preferred mode, and an update that tries to change a role, account status, identifier, or email shall be refused; an administrator may view any user's profile but not edit it, and only an administrator shall be able to change a user's account status."
    areas: [roles]
    tests:
      - "user-service/test/profile.test.ts::edits the caller’s own fields and returns the new state"
      - "user-service/test/profile.test.ts::rejects %s as not editable and changes nothing"
      - "user-service/test/profile.test.ts::cannot touch another user: the target is always the token’s subject"
  - id: US-FR3.1.2.1
    text: "A user who is not an administrator shall not be permitted to perform any action on another user's account, including by putting another account's identifier in a request."
    areas: [roles]
    tests:
      - "user-service/test/profile.test.ts::cannot touch another user: the target is always the token’s subject"
      - "user-service/test/matrix.test.ts::no client-supplied role, header or body field changes an outcome (US-NFR1.1.2)"
      - "user-service/test/matrix.test.ts::a well-formed but unknown id is refused before it is looked up, for a non-admin"
  - id: US-FR3.1.2.2
    text: "No account shall be deleted; an account that should no longer be used shall be suspended instead, so that every errand, credit entry, and audit record still resolves to the account it concerns."
    tests:
      - "user-service/test/matrix.test.ts::deny by default: every registered route is either in the matrix or explicitly public"
      - "user-service/test/admin.test.ts::suspends: status changes, sessions die, the account is locked out, event and audit written"
  - id: US-FR3.1.3.1
    text: "Only a bootstrap administrator (US-FR3.1.3.2) may remove another administrator's role or suspend another administrator; no administrator may remove their own role or suspend themselves, and a change that would leave no active administrator shall be refused."
    areas: [roles]
    tests:
      - "user-service/test/admin.test.ts::refuses an appointed admin who tries to downgrade another admin — even a seeded one"
      - "user-service/test/admin.test.ts::forbids demoting yourself, seeded or appointed"
      - "user-service/test/admin.test.ts::never leaves zero administrators, even when two seeded admins demote each other at once"
  - id: US-FR3.1.3.2
    text: "The first administrators (bootstrap administrators) shall be created from deployment configuration through the service's normal account provisioning, never by a direct database change. Running the bootstrap again, or twice at once, shall create no further accounts; each run shall be recorded in the audit trail without its secret; and no secret from the configuration shall remain usable after the administrator's first sign-in."
    areas: [roles, repeats]
    tests:
      - "user-service/test/seed.test.ts::creates one account when two bootstraps overlap (interleaved, not truly parallel)"
      - "user-service/test/seed.test.ts::writes one row per created admin, with the SYSTEM as actor and no secret"
      - "user-service/test/seed.test.ts::after the change, the new password works and the bootstrap password never does again"
  - id: US-FR3.1.3.3
    text: "An administrator shall be able to appoint an active student as an administrator, with a reason, without any developer involvement."
    areas: [roles]
    tests:
      - "user-service/test/admin.test.ts::appoints an admin, who can then use admin endpoints, and records who granted it"
      - "user-service/test/admin.test.ts::refuses to appoint an account that is not active"
      - "user-service/test/admin-controls.test.ts::changes nothing until a second admin approves; then applies once, with both names on record"
  - id: US-FR4.1.1
    text: "After a student's first activation, the service shall tell the Credit Service, so that the new account receives its initial credits."
    areas: [repeats]
    tests:
      - "user-service/test/registration.test.ts::activates the account and publishes exactly one user.activated"
      - "user-service/test/registration.test.ts::is idempotent on replay: 200, alreadyActivated, and no second event"
      - "scripts-demo-journey.sh::the wallet arrived by itself: 10 available, 0 reserved"
  - id: US-FR4.1.2
    text: "A lookup by another verified platform service shall return only whether the account exists, its status, its roles, and its display name, and shall never return passwords, stored password values, or security tokens."
    tests:
      - "user-service/test/internal-lookup.test.ts::returns only existence, status, roles and display name"
      - "user-service/test/internal-lookup.test.ts::never returns a hash, token or email, whatever the account state"
      - "user-service/test/matrix.test.ts::internal endpoint %i refuses every user token, including an administrator’s"
  - id: US-FR4.1.3
    text: "The service shall expose a user's effective permissions to any service that requires administrator authorization before carrying out an action."
    areas: [roles]
    tests:
      - "user-service/test/internal-lookup.test.ts::grants order permissions to an active student, and no admin rights"
      - "user-service/test/internal-lookup.test.ts::reports admin only for an ACTIVE account holding ADMIN"
      - "auth-client/test/integration.test.ts::rejects a real student token and accepts a real admin token on the admin route"
  - id: US-FR4.1.4
    text: "When an account is suspended or reactivated, the service shall tell dependent services which account changed, its new status, the reason, and when it happened, so that they can act on the change within 10 seconds."
    tests:
      - "user-service/test/admin.test.ts::suspends: status changes, sessions die, the account is locked out, event and audit written"
      - "user-service/test/admin.test.ts::reactivates, allows login again, and records event and audit"
      - "auth-client/test/integration.test.ts::a suspension is enforced no later than the window, and the answer is reused inside it"
  - id: US-NFR1.1.1
    text: "Automated tests shall cover every protected action for signed-out users, active students, suspended students, and administrators, including requests that name another user's account, with zero successful unauthorized actions."
    areas: [roles]
    tests:
      - "user-service/test/matrix.test.ts::unauthenticated → 401"
      - "user-service/test/matrix.test.ts::suspended student → refused, never a success"
      - "user-service/test/matrix.test.ts::deny by default: every registered route is either in the matrix or explicitly public"
  - id: US-NFR1.1.2
    text: "All permission decisions shall be made by the platform services, which shall check the signature, issuer, and expiry of the caller's token on every request before making one; nothing supplied by the user's device shall decide what a user may do."
    areas: [roles]
    tests:
      - "auth-client/test/authenticator.test.ts::a token signed by a different key, or with another issuer, → TOKEN_INVALID"
      - "auth-client/test/authenticator.test.ts::an expired token → TOKEN_EXPIRED (401), distinct from malformed"
      - "user-service/test/matrix.test.ts::no client-supplied role, header or body field changes an outcome (US-NFR1.1.2)"
  - id: US-NFR2.1.1
    text: "Passwords shall be stored only in a form that cannot be reversed and that makes guessing slow, with each password protected separately; no password, stored password value, or security token shall appear in application logs."
    tests:
      - "user-service/test/units.test.ts::hashes with Argon2id, verifies, and salts uniquely"
      - "user-service/test/log-privacy.test.ts::writes no password, hash or token to any log line at any level"
      - "user-service/test/log-privacy.test.ts::logs no email address, credential or token on any tested path"
  - id: US-NFR2.1.2
    text: "A session shall expire within seven days, shall be stored so that a copy of the stored data cannot be used to sign in, and shall stop granting access within 10 seconds of logout or suspension."
    tests:
      - "user-service/test/sessions.test.ts::ends a session seven days after login, however often it refreshes (US-FR1.1.2)"
      - "user-service/test/sessions.test.ts::stores only a hash of the refresh token"
      - "auth-client/test/authenticator.test.ts::a suspension or logout is enforced within the window — and not one tick earlier or later"
  - id: US-NFR4.1.1
    text: "Logs shall identify a user and a request only by platform identifiers, and shall never contain a user's email address, password, or security token in any tested path."
    tests:
      - "user-service/test/log-privacy.test.ts::logs no email address, credential or token on any tested path"
      - "user-service/test/log-privacy.test.ts::logs an unhandled error without the row PostgreSQL quotes or the address a mailer names"
      - "user-service/test/seed.test.ts::counts the admins created and lists the skipped entries"
  - id: US-NFR4.1.2
    text: "Each suspension, reactivation, and administrator role change shall record who acted, the affected account, the action, the reason, and the time, in a record that cannot be altered."
    areas: [roles]
    tests:
      - "user-service/test/admin.test.ts::lists records newest first and filters by target"
      - "user-service/test/admin.test.ts::appoints an admin, who can then use admin endpoints, and records who granted it"
      - "user-service/test/admin.test.ts::is append-only: the database rejects UPDATE and DELETE"
  - id: SS-FR1.1.1
    text: "A supplier shall have a system-assigned identifier that never changes, a name, a type (food, café, printing, shopping, or landmark), a building from the campus building list, a floor, a location description saying where to find it in the building, and whether it is active, and shall record when it was created and last changed; opening hours, coordinates, an image, and tags are optional."
    tests:
      - "supplier-service/test/provider.contract.test.ts::POST, GET, PUT and DELETE /suppliers with success and error responses"
      - "supplier-service/test/suppliers.test.ts::lets an admin create a supplier (201) and returns it"
      - "supplier-service/test/seed.test.ts::gives every record all required fields, one allowed type and a stable id"
    gap: "The service checks buildings against no campus list (normalizeBuilding keeps unknown buildings, and tests create suppliers in made-up buildings such as 'B0' and 'Zebra Hall'), so no test can prove a supplier's building comes from that list."
  - id: SS-FR1.1.2
    text: "The service shall reject a supplier with a missing or blank required field, a type or building not on its list, or malformed opening hours or coordinates, naming every field that failed and why, and shall save nothing. Two suppliers in one building may not share a name, ignoring letter case; branches of one brand in different buildings are separate suppliers."
    tests:
      - "supplier-service/test/suppliers.test.ts::reports an invalid type, a blank required field and a malformed coordinate together"
      - "supplier-service/test/suppliers.test.ts::refuses a case-insensitive duplicate of name+building among active suppliers"
      - "supplier-service/test/suppliers.test.ts::rejects latitude without longitude"
    gap: "No test rejects a building that is not on a campus list (the service accepts any building), sends malformed opening hours to the API, or checks that nothing was saved after a 422."
  - id: SS-FR1.1.3
    text: "Opening hours, where given, shall be recorded for each day of the week as zero or more pairs of opening and closing times in 24-hour format, so that a closed day, a midday break, or a supplier open all day can be represented; a closing time earlier than its opening time means closing after midnight."
    tests:
      - "supplier-service/test/units.test.ts::treats 0000-2359 as an all-day window across every day"
      - "supplier-service/test/units.test.ts::keeps a post-midnight close (opens > closes)"
      - "supplier-service/test/units.test.ts::converts 0900hrs to 09:00"
    gap: "Validation allows each day at most once ('split shifts are not supported'), so a day with two opening periods such as a midday break cannot be stored, and no test shows a closed day or 24-hour times through the API (these tests cover only seed normalization)."
  - id: SS-FR2.1.1
    text: "Any signed-in, active user may list, search, and view suppliers; only an administrator may create, update, or delete one, and each accepted change shall record when it was made."
    areas: [roles]
    tests:
      - "supplier-service/test/auth-integration.test.ts::rejects a student token on create and accepts an admin token"
      - "supplier-service/test/auth-integration.test.ts::lets a student read, and refuses a student on update and deactivate"
      - "supplier-service/test/auth-integration.test.ts::refuses a suspended admin and a revoked session, whatever the token still says"
    gap: "No test checks that an accepted update or deactivation moves updatedAt forward, or that a suspended user is refused a read."
  - id: SS-FR2.1.2.1
    text: "A supplier marked for deletion shall not be selectable for a new errand, and its record shall be retained until every errand referencing it has reached a terminal state, after which it may be removed."
    tests:
      - "order-service/test/order-creation.test.ts::rejects an inactive supplier without writing an order"
      - "supplier-service/test/suppliers.test.ts::excludes a deactivated supplier from listings but keeps its row, fetchable by id"
  - id: SS-FR2.1.3
    text: "Repeating a create request with the same request key shall return the original supplier rather than create another or report a duplicate; an update made to an out-of-date copy of a supplier shall be refused rather than overwrite a newer change; and a failed write shall leave the supplier as it was and tell the caller that nothing was saved."
    areas: [repeats]
    tests:
      - "supplier-service/test/suppliers.test.ts::returns the original supplier on a repeat, not a 409 or a second row"
      - "supplier-service/test/suppliers.test.ts::rejects a stale version with 412 and changes nothing"
      - "supplier-service/test/suppliers.test.ts::requires If-Match and refuses a stale version"
    gap: "No test makes a supplier write fail in storage (for example the database unavailable) and checks the supplier is unchanged and the caller is told nothing was saved."
  - id: SS-FR3.1.1
    text: "The list shall show active suppliers a page at a time, each with its identifier, name, type, building, and image where there is one, and let the user filter by type and by building; a search or filter that matches nothing shall return an empty page rather than an error."
    tests:
      - "supplier-service/test/suppliers-listing.test.ts::returns a lean list item — name, type, building, image only"
      - "supplier-service/test/suppliers-listing.test.ts::combines type and building filters"
      - "supplier-service/test/suppliers-listing.test.ts::is a 200 empty page when nothing matches, not a 404"
  - id: SS-FR3.1.2
    text: "Search shall match a supplier's name, building, location description, or tags regardless of letter case, and may be combined with the filters in SS-FR3.1.1."
    tests:
      - "supplier-service/test/suppliers-listing.test.ts::matches the term in name, building, location description or tags"
    gap: "No service test combines a search term with a type or building filter (only the web client's request building, in web-app/test/supplier-api.test.ts, sends them together)."
  - id: SS-FR3.1.3
    text: "The user shall be able to sort the list by name, type, building, or last update, ascending or descending, defaulting to name ascending; suppliers that tie shall always appear in the same order, so that paging never repeats or skips one."
    tests:
      - "supplier-service/test/suppliers-listing.test.ts::defaults to page 1, size 20, name ascending"
      - "supplier-service/test/suppliers-listing.test.ts::pages the full set with no gaps or duplicates, ordered by name then ID"
      - "supplier-service/test/suppliers-listing.test.ts::breaks equal-name ties by ID even when building order disagrees"
  - id: SS-FR3.2.1
    text: "A lookup by identifier shall return every stored field, including opening hours and the location description; an identifier that matches no supplier shall be reported as not found."
    tests:
      - "supplier-service/test/provider.contract.test.ts::POST, GET, PUT and DELETE /suppliers with success and error responses"
    gap: "No test checks that GET /suppliers/{id} for an unknown id answers 404 NOT_FOUND (the contract check also accepts a 422 or 503 there), or that stored opening hours and location description come back unchanged."
  - id: SS-FR4.1.1
    text: "Seeding shall load the template data, with its building names made consistent, plus additions, for at least 30 active suppliers covering every type and at least 10 campus buildings; running it again shall not duplicate or change existing suppliers."
    areas: [repeats]
    tests:
      - "supplier-service/test/seed.test.ts::holds ≥30 records across ≥10 buildings and every type"
      - "supplier-service/test/seed.test.ts::has no building that appears under two spellings"
      - "supplier-service/test/seed.test.ts::three consecutive runs keep the same count and identifiers"
  - id: SS-NFR1.1.1
    text: "Automated tests shall prove that every stored supplier has all required information, one allowed type, an unchanging identity, and no active duplicate with the same name and building, ignoring letter case."
    tests:
      - "supplier-service/test/seed.test.ts::gives every record all required fields, one allowed type and a stable id"
      - "supplier-service/test/suppliers.test.ts::refuses a case-insensitive duplicate of name+building among active suppliers"
      - "supplier-service/test/suppliers.test.ts::reports an invalid type, a blank required field and a malformed coordinate together"
  - id: SS-NFR1.1.2
    text: "Running the seed command three consecutive times shall produce the same record count and identifiers, with no duplicate or overwritten administrator edits."
    areas: [repeats]
    tests:
      - "supplier-service/test/seed.test.ts::three consecutive runs keep the same count and identifiers"
      - "supplier-service/test/seed.test.ts::never overwrites an admin edit made between runs"
      - "supplier-service/test/seed.test.ts::leaves a supplier the admin deactivated deactivated on re-run"
  - id: SS-NFR3.1.1
    text: "Deactivating a supplier shall not remove information that errands in progress rely on, and a deactivated supplier shall disappear from requester search within five seconds."
    tests:
      - "order-service/test/order-creation.test.ts::keeps the errand’s pickup as it was when the supplier is renamed, moved or deactivated"
      - "supplier-service/test/suppliers-listing.test.ts::are excluded from the listing but stay fetchable by id"
      - "web-app/test/suppliers.integration.test.tsx::lets an admin create, edit and delete a supplier from the page"
  - id: SS-NFR3.1.2
    text: "A restart test shall show zero loss of saved supplier changes and readiness within 60 seconds once the service's storage is available."
    tests:
      - "scripts-restart-check.sh::no table in any of the five databases lost a row"
      - "scripts-restart-check.sh::every service is healthy again once Postgres is back"
    gap: "The CI restart check compares only row counts and saves no supplier edit before restarting, so a lost change would go unnoticed, and it allows 120–180 s for recovery instead of checking readiness within 60 s."
  - id: OS-FR1.1.1
    text: "If the reservation is refused, the errand shall be rejected with the reason and no credits held; for insufficient credits, the requester shall be told the amount required and their available balance."
    areas: [reservations, transitions]
    tests:
      - "order-service/test/reservation-results.test.ts::moves a refusal to REJECTED with its actionable insufficient-credit details"
      - "web-app/e2e/request-journey.e2e.ts::request journey: post, wait for credits, open; then an insufficient-credit rejection"
      - "system-tests/test/races.test.ts::never lets concurrent reservations overspend one wallet"
  - id: OS-FR1.1.2
    text: "If the Credit Service is unavailable, the errand shall wait rather than be rejected, and shall open or be rejected once the Credit Service answers, without the requester resubmitting."
    areas: [reservations, transitions]
    tests:
      - "order-service/test/order-credit-wait.test.ts::surfaces an order waiting over 5 minutes to an operator once, and it still opens later"
      - "scripts-restart-check.sh::a second errand waits for Credit, which is stopped"
      - "scripts-restart-check.sh::the errand that was waiting for Credit opened by itself"
    gap: "No test lets Credit come back from an outage and then refuse, to show a waiting errand becomes REJECTED; only the late-OPEN path is proven."
  - id: OS-FR1.1.3
    text: "The request to reserve credits shall be saved together with the errand, so that no saved errand is left without one; an errand still waiting for credits after five minutes shall be surfaced to an operator."
    areas: [reservations]
    tests:
      - "order-service/test/order-creation.test.ts::commits PENDING_CREDIT and both outbox facts while Credit is absent"
      - "order-service/test/order-creation.test.ts::rolls back every write when creation fails after %s"
      - "order-service/test/order-credit-wait.test.ts::surfaces an order waiting over 5 minutes to an operator once, and it still opens later"
  - id: OS-FR1.2.1
    text: "An errand shall have an acceptance deadline of 60 minutes from when it opens, and the interface shall show the time remaining."
    tests:
      - "order-service/test/reservation-results.test.ts::moves a pending order to OPEN once and starts its acceptance deadline"
      - "order-service/test/order-acceptance.test.ts::lists only unexpired OPEN orders through a privacy-safe summary"
      - "web-app/test/errand-actions.test.tsx::counts down from the time the server gave and removes the card at zero"
    gap: "No test checks that the deadline is exactly 60 minutes after opening; tests only check it is in the future, and 60 minutes is just the ACCEPTANCE_WINDOW_MS config default (3600000)."
  - id: OS-FR1.3.1
    text: "A request shall specify one active supplier, one or more items, a delivery zone, exact delivery instructions, and a reward of one to five credits; a request missing any of these, naming an inactive supplier, or made by a suspended student shall be refused without saving an errand or reserving any credits."
    areas: [roles, reservations]
    tests:
      - "order-service/test/order-creation.test.ts::rejects invalid input before contacting Supplier or entering the saga"
      - "order-service/test/order-creation.test.ts::rejects an inactive supplier without writing an order"
      - "system-tests/test/reward-bounds.test.ts::Order's largest reward is exactly the largest reservation Credit accepts"
    gap: "No test posts an errand as a suspended student (suspension is only tested on other endpoints and in the auth guard), and no test sends a request missing only the delivery zone or only the delivery instructions."
  - id: OS-FR2.1.1
    text: "The open list shall include supplier, item summary, delivery zone, reward, and time remaining, but shall hide exact delivery instructions until the courier is assigned."
    areas: [roles]
    tests:
      - "order-service/test/order-acceptance.test.ts::lists only unexpired OPEN orders through a privacy-safe summary"
      - "order-service/test/order-privacy.test.ts::leaks nothing to a former courier, an unrelated student or an unreferred administrator"
      - "web-app/e2e/errand-journey.e2e.ts::errand journey: a lost acceptance race, fulfilment, and the requester confirming"
  - id: OS-FR2.1.2
    text: "A requester or currently assigned courier shall see full errand details and status history, and an administrator may see those of an errand referred to them under OS-FR9.1.1; any other student, including a courier who withdrew or was removed, shall see only the open-list view and shall be denied access to private details."
    areas: [roles]
    tests:
      - "order-service/test/order-privacy.test.ts::leaks nothing to a former courier, an unrelated student or an unreferred administrator"
      - "order-service/test/order-privacy.test.ts::removes a timed-out courier from private access and keeps closed orders private"
      - "order-service/test/order-privacy.test.ts::opens a dispute to its assigned administrator only, and moves that access on replacement"
  - id: OS-FR2.1.3
    text: "An errand's details shall show its supplier as it was when the errand was created, even after the supplier is changed or removed."
    tests:
      - "order-service/test/order-creation.test.ts::keeps the errand’s pickup as it was when the supplier is renamed, moved or deactivated"
  - id: OS-FR3.1.1
    text: "Acceptance shall be rejected if the actor is the requester, the actor is suspended, the errand is no longer open, or the acceptance deadline has passed."
    areas: [roles, transitions]
    tests:
      - "order-service/test/order-acceptance.test.ts::refuses self, suspended, stale-version, expired and non-OPEN acceptance"
      - "order-service/test/order-mutation-matrix.test.ts::in %s, every refused command is 403/409 and leaves no trace"
      - "scripts-demo-journey.sh::a requester cannot accept their own errand (403 SELF_ACCEPTANCE_FORBIDDEN)"
