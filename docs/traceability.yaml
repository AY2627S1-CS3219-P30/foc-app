      - "order-service/test/order-state-machine.test.ts::never lets a requester accept their own errand or a non-admin resolve a dispute"
  - id: OS-NFR3.1.1
    text: "Each time-based rule (acceptance deadline, pickup timeout, auto-confirmation, and late-delivery referral for a suspended requester) shall take effect no later than 60 seconds after its time passes; one that fell due while the service was unavailable shall take effect within 60 seconds of the service becoming ready."
    areas: [transitions]
    tests:
      - "order-service/test/order-cancel-expiry.test.ts::applies a timer that fell due during downtime as soon as the service is ready"
      - "order-service/test/order-outcomes.test.ts::auto-confirms a delivered errand once its period has passed, requesting the transfer once"
      - "order-service/test/participant-suspension.test.ts::refers a picked-up errand when the delivery period ends after its requester was suspended"
    gap: "Only the acceptance deadline is timed against 60 s, and only after downtime. The other timers are shown to fire on the next sweep, but the 60 s limit on LIFECYCLE_SWEEP_INTERVAL_MS is enforced only by the config schema and no test checks it."
  - id: OS-NFR3.1.2
    text: "If a participant action and a time-based rule apply to the same errand at the same moment, only one shall take effect, so an errand is never, for example, both accepted and expired."
    areas: [transitions]
