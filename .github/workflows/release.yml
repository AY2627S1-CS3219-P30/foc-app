# A release candidate or the final release (REL-03, #169). Pushing a tag such as rc1-d4 or v1.0-d4
# gives the images CI already built and scanned for that commit the tag, and records them in a
# GitHub Release. It builds nothing. See docs/runbooks/release.md.
name: Release

on:
  push:
    tags:
      - 'rc[0-9]+-d4'
      - 'v[0-9]+.[0-9]+-d4'

permissions: {}

jobs:
  release:
    name: Tag the images and record them
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the GitHub Release
      packages: write # the tag on each image
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # The script checks the commit is on main.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the images and create the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts-release.sh "$GITHUB_REF_NAME"
