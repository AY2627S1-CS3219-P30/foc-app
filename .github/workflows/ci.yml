name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same PR cancels the previous run — nobody reads the results
# of a superseded commit, and the runner minutes are better spent elsewhere.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Work out what actually changed, so a supplier-only edit does not rebuild and
  # retest all four services. Anything shared (platform/, root config, this
  # workflow) fans out to every service, because it can break any of them — and
  # so does any path the filter does not recognise, so it fails closed.
  # ---------------------------------------------------------------------------
  detect:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.services }}
      web: ${{ steps.filter.outputs.web }}
      node: ${{ steps.filter.outputs.node }}
      stack: ${{ steps.filter.outputs.stack }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed to diff against the base commit rather than a shallow clone.
          fetch-depth: 0

      # The filter decides which of the jobs below run at all, so prove it first.
      - name: Self-test the path filter
        run: ./scripts-ci-detect.sh --self-test

      - id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          elif [[ -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          else
            # First push to a branch, or a force-push that dropped the old tip:
            # no usable base, so treat everything as changed.
            BASE=""
            HEAD="${{ github.sha }}"
          fi

          if [[ -n "$BASE" ]] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          else
            echo "No usable base commit — treating every path as changed."
            CHANGED=$(git ls-files)
          fi

          echo "Changed files:"
          printf '%s\n' "$CHANGED" | sed 's/^/  /'
          echo "--- outputs ---"

          # Always smoke the stack on a push to main, even if only code changed:
          # main is what everyone branches from.
          if [[ "${{ github.event_name }}" == "push" ]]; then
            export FORCE_STACK=true
          fi

          printf '%s\n' "$CHANGED" | ./scripts-ci-detect.sh | tee -a "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Lint and formatting run once over the whole repository. They are fast enough
  # that splitting them per service would cost more in scheduling than it saves.
  # ---------------------------------------------------------------------------
  quality:
    name: Lint and format
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  # ---------------------------------------------------------------------------
  # Per service: typecheck, test, and build the image. The image build is what
  # catches a broken Dockerfile before a human reads the diff.
  # ---------------------------------------------------------------------------
  service:
    name: ${{ matrix.service }}
    needs: detect
    if: needs.detect.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Shared packages must be compiled first: the services import their built
      # output, not their source. Read from the root workspaces in order, which
      # puts platform/ ahead of the packages that build on it.
      - name: Build shared packages
        run: |
          for pkg in $(jq -r '.workspaces[] | select(endswith("-service") | not)' package.json); do
            npm run build -w "$pkg" --if-present
          done

      - name: Typecheck
        run: npm run typecheck -w @foc/${{ matrix.service }}

      - name: Test
        run: npm test -w @foc/${{ matrix.service }}

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ---------------------------------------------------------------------------
  # Every shared package, read from the root workspaces: platform/ today, and
  # any package added later without editing this file. RabbitMQ runs alongside
  # so the broker integration tests run here instead of skipping themselves.
  # ---------------------------------------------------------------------------
  packages:
    name: Shared packages
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: foc
          RABBITMQ_DEFAULT_PASS: foc_dev
        ports: ['5672:5672']
        # The same probe compose.yaml uses: `ping` can pass before the broker
        # accepts connections.
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 15s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Build rather than a separate typecheck: tsc checks types either way, and
      # a later package may import an earlier one's built output.
      - name: Build and test each shared package
        env:
          RABBITMQ_URL: amqp://foc:foc_dev@localhost:5672
        run: |
          for pkg in $(jq -r '.workspaces[] | select(endswith("-service") | not)' package.json); do
            echo "::group::$pkg"
            npm run build -w "$pkg" --if-present
            npm test -w "$pkg"
            echo "::endgroup::"
          done

  # ---------------------------------------------------------------------------
  web-app:
    name: web-app
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build

  # ---------------------------------------------------------------------------
  # The per-service image build proves a Dockerfile compiles. This proves the
  # containers actually talk to each other — database isolation, CORS, health.
  # ---------------------------------------------------------------------------
  stack:
    name: Compose smoke
    needs: detect
    if: needs.detect.outputs.stack == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # On failure the script prints each container's logs itself, before it
      # tears the stack down. A separate step afterwards would find nothing.
      - name: Start the stack and smoke it
        run: |
          cp .env.example .env
          ./scripts-smoke.sh --up

  # ---------------------------------------------------------------------------
  # Required status check.
  #
  # This exists because a *skipped* job never reports a status, so naming the
  # jobs above as required would block every PR that legitimately skips one.
  # This job always runs, and fails if anything it depends on failed. Make this
  # the only required check on main.
  # ---------------------------------------------------------------------------
  ci:
    name: CI
    if: always()
    needs: [detect, quality, service, packages, web-app, stack]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS"
          failed=$(printf '%s' "$NEEDS" \
            | jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key')
          if [[ -n "$failed" ]]; then
            echo "::error::Failing jobs: $(printf '%s' "$failed" | tr '\n' ' ')"
            exit 1
          fi
          echo "All required jobs passed or were skipped."
