name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same PR cancels the previous run — nobody reads the results
# of a superseded commit, and the runner minutes are better spent elsewhere. Any
# other run (a push to main, a manual run) has a group of its own. GitHub keeps
# one pending run per group and drops the others, so in a shared group a merged
# commit's run could be dropped while it waited, and that commit never published.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Work out what actually changed, so a supplier-only edit does not rebuild and
  # retest all four services. Anything shared (platform/, root config, this
  # workflow) fans out to every service, because it can break any of them — and
  # so does any path the filter does not recognise, so it fails closed.
  # ---------------------------------------------------------------------------
  detect:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.services }}
      web: ${{ steps.filter.outputs.web }}
      node: ${{ steps.filter.outputs.node }}
      stack: ${{ steps.filter.outputs.stack }}
      supplier_stack: ${{ steps.filter.outputs.supplier_stack }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed to diff against the base commit rather than a shallow clone.
          fetch-depth: 0

      # The filter decides which of the jobs below run at all, so prove it first.
      - name: Self-test the path filter
        run: ./scripts-ci-detect.sh --self-test

      - id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          elif [[ -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          else
            # First push to a branch, or a force-push that dropped the old tip:
            # no usable base, so treat everything as changed.
            BASE=""
            HEAD="${{ github.sha }}"
          fi

          if [[ -n "$BASE" ]] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          else
            echo "No usable base commit — treating every path as changed."
            CHANGED=$(git ls-files)
          fi

          echo "Changed files:"
          printf '%s\n' "$CHANGED" | sed 's/^/  /'
          echo "--- outputs ---"

          # Always smoke the stack on a push to main, even if only code changed:
          # main is what everyone branches from.
          if [[ "${{ github.event_name }}" == "push" ]]; then
            export FORCE_STACK=true
          fi

          printf '%s\n' "$CHANGED" | ./scripts-ci-detect.sh | tee -a "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Lint and formatting run once over the whole repository. They are fast enough
  # that splitting them per service would cost more in scheduling than it saves.
  # ---------------------------------------------------------------------------
  quality:
    name: Lint and format
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The contract check reads contracts/ at the branch's merge base.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - uses: ./.github/actions/trivy-db
      # NTH-04 (PL-NFR4.1.2): a critical vulnerability with a fix, in a production dependency.
      - name: Scan the production dependencies for vulnerabilities
        run: ./scripts-scan-vulnerabilities.sh --lockfile
      # EI-NFR3.1.1: v1 contracts are additive only. Compare against where this
      # branch left main, so contract changes merged since are not read as removals.
      - name: Contract compatibility
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE=$(git merge-base "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          elif [[ -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]] \
            && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            BASE="${{ github.event.before }}"
          else
            echo "No usable base commit; nothing to compare against."
            exit 0
          fi
          npm run contracts:compat -w @foc/test-harness -- --base "$BASE"

  # ---------------------------------------------------------------------------
  # Per service: typecheck, test, and build the image. The image build is what
  # catches a broken Dockerfile before a human reads the diff.
  # ---------------------------------------------------------------------------
  service:
    name: ${{ matrix.service }}
    needs: detect
    if: needs.detect.outputs.services != '[]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: postgres
          # Exists only for this job's container: derived from the run, never written down.
          POSTGRES_PASSWORD: ${{ github.sha }}
          POSTGRES_DB: foc_credit_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d foc_credit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Shared packages must be compiled first: the services import their built
      # output, not their source. Read from the root workspaces in order, which
      # puts platform/ ahead of the packages that build on it.
      - name: Build shared packages
        run: |
          for pkg in $(jq -r '.workspaces[] | select(endswith("-service") | not)' package.json); do
            npm run build -w "$pkg" --if-present
          done

      - name: Typecheck
        run: npm run typecheck -w @foc/${{ matrix.service }}

      - name: Test
        env:
          # Turns on the real-PostgreSQL suites (*.postgres.test.ts). The shared
          # test harness creates, migrates and drops a fresh database per suite,
          # so no suite shares data with another (docs/testing.md).
          TEST_POSTGRES_URL: postgres://postgres:${{ github.sha }}@localhost:5432/postgres
        # Coverage is reported, not gated (PL-NFR4.1.1): no package has a threshold.
        run: npm test -w @foc/${{ matrix.service }} -- --coverage --coverage.reporter=text-summary --coverage.reporter=json-summary

      - name: Coverage summary
        run: ./scripts-coverage-summary.sh ${{ matrix.service }} >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: false
          # Loaded, so the scan below reads the image this change builds.
          load: true
          tags: foc-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - uses: ./.github/actions/trivy-db
      # NTH-04 (PL-NFR4.1.2): a critical vulnerability with a fix, anywhere in the image.
      - name: Scan the image for vulnerabilities
        run: ./scripts-scan-vulnerabilities.sh --image foc-${{ matrix.service }}:ci

  # ---------------------------------------------------------------------------
  # Every shared package, read from the root workspaces: platform/, the test
  # harness, auth-client, and any package added later without editing this file.
  # RabbitMQ and PostgreSQL run alongside so the broker and real-database
  # integration tests run here instead of skipping themselves.
  # ---------------------------------------------------------------------------
  packages:
    name: Shared packages
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: postgres
          # Exists only for this job's container: derived from the run, never written down.
          POSTGRES_PASSWORD: ${{ github.sha }}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:4.3.6-management-alpine@sha256:3ef7f7e89fed709a78f79b8b5f4e30e1312a1d4089da752e23595566d9d61a95
        env:
          RABBITMQ_DEFAULT_USER: foc
          RABBITMQ_DEFAULT_PASS: ${{ github.sha }}
        ports: ['5672:5672']
        # The same probe compose.yaml uses: `ping` can pass before the broker
        # accepts connections.
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 15s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Build rather than a separate typecheck: tsc checks types either way, and
      # a later package may import an earlier one's built output.
      - name: Build and test each shared package
        env:
          RABBITMQ_URL: amqp://foc:${{ github.sha }}@localhost:5672
          TEST_POSTGRES_URL: postgres://postgres:${{ github.sha }}@localhost:5432/postgres
        run: |
          for pkg in $(jq -r '.workspaces[] | select(endswith("-service") | not)' package.json); do
            echo "::group::$pkg"
            npm run build -w "$pkg" --if-present
            npm test -w "$pkg" -- --coverage --coverage.reporter=text-summary --coverage.reporter=json-summary
            echo "::endgroup::"
          done
          # Reported, not gated: no package has a coverage threshold.
          mapfile -t shared < <(jq -r '.workspaces[] | select(endswith("-service") | not)' package.json)
          ./scripts-coverage-summary.sh "${shared[@]}" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  web-app:
    name: web-app
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      # Unit tests use Bun's built-in runner; test/ is excluded from the Next typecheck. Its
      # coverage table is in the log (reported, not gated).
      - run: bun test --coverage
      - run: bun run typecheck:contracts

      # The image, as compose.yaml builds it, so its build arguments are defined once. Its
      # `next build` is the app's build check, Next's typecheck included, so the app is built
      # once, here, not again on the runner. Bake reads compose.yaml, which refuses to load
      # without its secrets: generated and thrown away.
      - name: Generate a throwaway .env
        working-directory: .
        run: ./scripts-init-env.sh
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/bake-action@v6
        with:
          source: .
          files: compose.yaml
          targets: web-app
          load: true
          set: |
            web-app.tags=foc-web-app:ci
            web-app.cache-from=type=gha,scope=web-app
            web-app.cache-to=type=gha,mode=max,scope=web-app
      - uses: ./.github/actions/trivy-db
      # NTH-04 (PL-NFR4.1.2): a critical vulnerability with a fix, anywhere in the image.
      - name: Scan the image for vulnerabilities
        working-directory: .
        run: ./scripts-scan-vulnerabilities.sh --image foc-web-app:ci

  # ---------------------------------------------------------------------------
  # The per-service image build proves a Dockerfile compiles. This proves the
  # containers actually talk to each other — database isolation, CORS, health.
  # ---------------------------------------------------------------------------
  stack:
    name: Compose smoke
    needs: detect
    if: needs.detect.outputs.stack == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # PLT-05: the alert rules fire when they should (observability/alerts.test.yml).
      - name: Test the alert rules
        run: |
          docker run --rm -v "$PWD/observability:/rules:ro" --entrypoint promtool \
            prom/prometheus:v3.13.4@sha256:87861b8cf91579109319ebc300f3f1060e6da9c05d6ae8ad15a20c879e84e32e test rules /rules/alerts.test.yml
      # On failure the script prints each container's logs itself, before it
      # tears the stack down. A separate step afterwards would find nothing.
      # PLT-06: no secret in any file git tracks, and none in an image this repository builds.
      # First, so that it builds the images the steps below then start from cache.
      - name: Scan the repository and the images for secrets
        run: |
          ./scripts-init-env.sh
          ./scripts-scan-secrets.sh
      - name: Start the stack and smoke it
        run: ./scripts-smoke.sh --up
      # EVT-03: a duplicate, a killed consumer, a stale reply and an unsupported version, on a
      # stack of its own (the smoke run has removed its copy), ending with credits conserved.
      - name: Force messaging failures and check the outcome
        run: ./scripts-demo-failures.sh --up
      # CRD-09: reserve, transfer and release through the public API, with both wallets before and
      # after each, ending with the closed-economy invariants checked on the live database.
      - name: Walk the credits through an errand
        run: ./scripts-demo-credits.sh --up
      # PLT-06: stop and start every container, remove and recreate them, and take Postgres away
      # under the running services. Nothing committed is lost, a waiting message is handled once,
      # and a service without its database says 503 instead of accepting a write.
      - name: Restart, recreate and lose a dependency
        run: ./scripts-restart-check.sh --up
      # PLT-07: the D3 demo's journey through the public API. A student registers and gets a
      # wallet; an errand is created, accepted, delivered and paid; one is cancelled; six actions
      # are refused; and a dead letter left by a database outage is redriven by an administrator.
      - name: The demo journey, end to end
        run: ./scripts-demo-journey.sh --up --redrive

  # ---------------------------------------------------------------------------
  # The supplier page against the real Supplier Service, verifying tokens with
  # the real User Service: a student browses and is refused a create; an admin
  # creates, edits and deletes through the page (web-app/README.md). Only the
  # services it needs come up; the whole stack is the smoke job's.
  # ---------------------------------------------------------------------------
  supplier-stack:
    name: Supplier listing integration
    needs: detect
    if: needs.detect.outputs.supplier_stack == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Start the User and Supplier Services
        run: |
          ./scripts-init-env.sh
          docker compose -p foc-it up -d --build user-service supplier-service
          for port in 3001 3002; do
            for _ in $(seq 1 60); do
              curl -fsS "http://localhost:${port}/health" >/dev/null 2>&1 && break
              sleep 2
            done
            curl -fsS "http://localhost:${port}/health" || {
              echo "::error::Nothing healthy on port ${port}"
              exit 1
            }
            echo
          done
      - run: bun install --frozen-lockfile
        working-directory: web-app
      - name: Supplier listing integration test
        working-directory: web-app
        env:
          SUPPLIER_SERVICE_URL: http://localhost:3002
          USER_SERVICE_URL: http://localhost:3001
        # The seeded admin's bootstrap password is whatever this run's `.env` generated.
        run: |
          ADMIN_SEED_PASSWORD="$(grep '^ADMIN_SEED_PASSWORD=' ../.env | cut -d= -f2-)"
          export ADMIN_SEED_PASSWORD
          bun test test/suppliers.integration.test.tsx
      - name: Service logs
        if: failure()
        run: docker compose -p foc-it logs --no-color --tail=200 user-service supplier-service
      - name: Tear down
        if: always()
        run: docker compose -p foc-it down -v

  # ---------------------------------------------------------------------------
  # The browser journeys in a real browser against the real stack, at 360, 768
  # and 1440 px: the account journey (USR-05), keyboard only with an axe scan of
  # every screen, and the request journey (WEB-01) through the Supplier, Order and
  # Credit Services. A copy of the stack of its own, so the smoke job's teardown
  # cannot race it.
  # ---------------------------------------------------------------------------
  e2e:
    name: Browser journeys (Playwright)
    needs: detect
    if: >-
      needs.detect.outputs.web == 'true' ||
      needs.detect.outputs.stack == 'true' ||
      contains(needs.detect.outputs.services, 'user-service') ||
      contains(needs.detect.outputs.services, 'supplier-service') ||
      contains(needs.detect.outputs.services, 'order-service') ||
      contains(needs.detect.outputs.services, 'credit-service')
    runs-on: ubuntu-latest
    # A normal run takes about 4 minutes. Without a limit a hung step runs for GitHub's six hours.
    timeout-minutes: 20
    env:
      # The images the bake step below builds and names (compose.images.yaml gives a service and
      # its migrate container one image), for every docker compose call, the smoke test's included.
      COMPOSE_FILE: compose.yaml:compose.images.yaml
      FOC_IMAGE_TAG: ci
      # GitHub's Ubuntu runners come with Google Chrome and its system libraries; Playwright drives
      # it, so nothing is downloaded, or installed with apt, while the job runs.
      E2E_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # compose.yaml refuses to load without its secrets: generated and thrown away.
      - name: Generate a throwaway .env
        run: ./scripts-init-env.sh
      # From the layer cache the per-service jobs and the publish job fill, rather than from scratch.
      - name: Build the stack's images
        uses: docker/bake-action@v6
        with:
          source: .
          files: |
            compose.yaml
            compose.images.yaml
          targets: |
            user-service
            supplier-service
            order-service
            credit-service
            web-app
          load: true
          set: |
            user-service.cache-from=type=gha,scope=user-service
            supplier-service.cache-from=type=gha,scope=supplier-service
            order-service.cache-from=type=gha,scope=order-service
            credit-service.cache-from=type=gha,scope=credit-service
            web-app.cache-from=type=gha,scope=web-app
      - name: Start the stack
        run: |
          docker compose up -d --no-build
          ./scripts-smoke.sh
      - run: bun install --frozen-lockfile
        working-directory: web-app
      - name: The runner's Chrome
        run: google-chrome --version
      - name: Run the browser journeys
        working-directory: web-app
        run: bun run e2e
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail=100
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web-app/playwright-report
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Required status check.
  #
  # This exists because a *skipped* job never reports a status, so naming the
  # jobs above as required would block every PR that legitimately skips one.
  # This job always runs, and fails if anything it depends on failed. Make this
  # the only required check on main.
  # ---------------------------------------------------------------------------
  ci:
    name: CI
    if: always()
    needs: [detect, quality, service, packages, web-app, stack, supplier-stack, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS"
          failed=$(printf '%s' "$NEEDS" \
            | jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key')
          if [[ -n "$failed" ]]; then
            echo "::error::Failing jobs: $(printf '%s' "$failed" | tr '\n' ' ')"
            exit 1
          fi
          echo "All required jobs passed or were skipped."

  # ---------------------------------------------------------------------------
  # NTH-04 (#164): publish every application image to the GitHub Container
  # Registry, for a push to main that passed every check above. Each is tagged
  # with its commit (`sha-<commit>`), so a merged commit can be started again,
  # and rolled back to, from compose.images.yaml (PLT-09, #284); `main` names the
  # newest. Built with `docker buildx bake` from compose.yaml and that override,
  # so the images get exactly compose.yaml's build arguments, from the layer
  # cache the per-service job fills. All five are scanned before any is pushed,
  # changed in this push or not: a critical vulnerability with a fix, disclosed
  # since an image was last scanned, stops the publish. The only job that may
  # write to the registry.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish images
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      FOC_IMAGE_TAG: sha-${{ github.sha }}
      REGISTRY: ghcr.io/ay2627s1-cs3219-p30
      APPLICATIONS: user-service supplier-service order-service credit-service web-app
    steps:
      - uses: actions/checkout@v4
      # compose.yaml refuses to load without its secrets. They are generated here and
      # thrown away with the runner: no build reads them, so none reaches an image.
      - name: Generate a throwaway .env
        run: ./scripts-init-env.sh
      - uses: docker/setup-buildx-action@v3
      # Loaded into Docker, not pushed: what reaches the registry is what the scan reads.
      - name: Build every image
        uses: docker/bake-action@v6
        with:
          # The checkout, not the Git context: bake must read the .env generated above.
          source: .
          files: |
            compose.yaml
            compose.images.yaml
          targets: |
            user-service
            supplier-service
            order-service
            credit-service
            web-app
          load: true
          set: |
            *.labels.org.opencontainers.image.source=https://github.com/${{ github.repository }}
            *.labels.org.opencontainers.image.revision=${{ github.sha }}
            web-app.labels.org.opencontainers.image.description=Runs behind the edge: it calls the services at /api/<service> on its own origin. Links sign-up to the dev mailbox and the admin console to Grafana on localhost:3005.
            user-service.cache-from=type=gha,scope=user-service
            supplier-service.cache-from=type=gha,scope=supplier-service
            order-service.cache-from=type=gha,scope=order-service
            credit-service.cache-from=type=gha,scope=credit-service
            web-app.cache-from=type=gha,scope=web-app
            # Written back from main, whose cache every later run can read; a pull request's is
            # its own. The per-service job writes the same scopes, so a PR starts from this.
            user-service.cache-to=type=gha,mode=max,scope=user-service
            supplier-service.cache-to=type=gha,mode=max,scope=supplier-service
            order-service.cache-to=type=gha,mode=max,scope=order-service
            credit-service.cache-to=type=gha,mode=max,scope=credit-service
            web-app.cache-to=type=gha,mode=max,scope=web-app
      - uses: ./.github/actions/trivy-db
      - name: Scan every image for vulnerabilities
        run: |
          images=()
          for application in $APPLICATIONS; do images+=("$REGISTRY/foc-$application:$FOC_IMAGE_TAG"); done
          ./scripts-scan-vulnerabilities.sh --image "${images[@]}"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the scanned images
        run: |
          for application in $APPLICATIONS; do docker push "$REGISTRY/foc-$application:$FOC_IMAGE_TAG"; done
      # Runs on main are never dropped or cancelled (see concurrency above), so two can finish
      # out of order. A run moves `main` only while its commit is still main's newest; when it is
      # not, the newer commit's run moves it.
      - name: Point main at this commit, if it is still the newest
        run: |
          newest="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$newest" != "$GITHUB_SHA" ]]; then
            echo "main is now at $newest; that commit's run points main at its images."
            exit 0
          fi
          for application in $APPLICATIONS; do
            docker tag "$REGISTRY/foc-$application:$FOC_IMAGE_TAG" "$REGISTRY/foc-$application:main"
            docker push "$REGISTRY/foc-$application:main"
          done
