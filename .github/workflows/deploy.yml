# AI Assistance Disclosure:
# Tool: Claude Code (Claude Opus 5.5), date: 2026-11-09
# Scope: Generated the deploy workflow for the AWS host (PLT-14, #357).
# Author review: Jonus Ho reviewed it in #401 and fixed what the review found, before merge.

# Deploys published images to the AWS host (PLT-14, #357). CI calls it after every publish from
# main while the repository variable AWS_AUTO_DEPLOY is `true`; run it by hand from the Actions tab
# for a release tag, or while auto-deploy is off. It builds nothing: through SSM it runs
# ./scripts-deploy.sh on the host, which checks out the commit and starts that commit's images.
# GitHub signs in to AWS with OIDC, so no AWS key is stored and port 22 can stay closed.
# docs/runbooks/aws-deploy.md says how to set up the role, the host and the variables.
name: Deploy

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'sha-<40 hex commit> on main, or a release tag such as rc1-d4'
        type: string
        required: true

permissions: {}

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The environment holds the variables, deploys from main only, and can be given required reviewers.
    environment:
      name: aws
      url: ${{ vars.AWS_DEPLOY_URL }}
    # One deploy at a time, and none cancelled halfway: a newer one waits for it.
    concurrency:
      group: deploy-aws
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # the OIDC token AWS trades for the deploy role
    env:
      TAG: ${{ inputs.tag }}
      INSTANCE: ${{ vars.AWS_DEPLOY_INSTANCE_ID }}
      HOST_USER: ${{ vars.AWS_DEPLOY_USER || 'ubuntu' }}
      HOST_PATH: ${{ vars.AWS_DEPLOY_PATH || '/home/ubuntu/foc-app' }}
    steps:
      # Each value goes into a shell command on the host, so each must be what it says it is.
      - name: Check the inputs and variables
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^(sha-[0-9a-f]{40}|(rc[0-9]+|v[0-9]+\.[0-9]+)-d4)$ ]] ||
            { echo "::error::'$TAG' is not sha-<40 hex commit>, rcN-d4 or vN.N-d4."; exit 1; }
          [[ "$INSTANCE" =~ ^i-[0-9a-f]{8,17}$ ]] ||
            { echo '::error::Set AWS_DEPLOY_INSTANCE_ID (i-...) on the aws environment.'; exit 1; }
          [[ "$HOST_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] ||
            { echo '::error::AWS_DEPLOY_USER is not a user name.'; exit 1; }
          [[ "$HOST_PATH" =~ ^/[A-Za-z0-9_./-]+$ ]] ||
            { echo '::error::AWS_DEPLOY_PATH is not an absolute path.'; exit 1; }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Run scripts-deploy.sh on the host
        run: |
          set -euo pipefail
          # SSM runs as root. The clone, .env and Docker access belong to the host's user.
          command="runuser -l $HOST_USER -c 'cd $HOST_PATH && ./scripts-deploy.sh $TAG'"
          parameters="$(jq -nc --arg command "$command" '{commands: [$command], executionTimeout: ["1500"]}')"
          id="$(aws ssm send-command --instance-ids "$INSTANCE" --document-name AWS-RunShellScript \
            --comment "deploy $TAG" --parameters "$parameters" --query Command.CommandId --output text)"
          echo "SSM command $id on $INSTANCE"
          # The invocation does not exist for a moment after it is sent, so that reads as Pending.
          # The job's timeout bounds the wait.
          while :; do
            sleep 10
            status="$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
              --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in Pending | InProgress | Delayed) ;; *) break ;; esac
          done
          # SSM keeps the last 24,000 characters of each stream.
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
            --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
            --query StandardErrorContent --output text >&2
          if [[ "$status" != Success ]]; then
            echo "::error::The deploy of $TAG ended $status. Its output is above."
            exit 1
          fi
